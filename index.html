<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C40D11">
<title>Loss Prevention Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red:#C40D11; --red-deep:#A50A0E; --ink:#1D1D1B; --dim:#97938D; --line:#E8E5DF; --oferta:#FFE99A;
    --am:#FFC845; --mid:#00A88E; --otro:#23508F;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
    --nav-h: 62px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { color:var(--ink); font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    background:linear-gradient(175deg,var(--red) 0%,var(--red-deep) 100%); background-attachment:fixed; overscroll-behavior-y:none; }
  button, input, select, textarea { font-family:inherit; }
  .app { position:relative; display:flex; flex-direction:column; height:100dvh; max-width:520px; margin:0 auto; overflow:hidden; }

  /* cabecera compacta */
  .hdr { flex-shrink:0; padding:calc(var(--safe-top) + 10px) 14px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px; color:#fff; }
  .hdr-left { display:flex; align-items:center; gap:9px; min-width:0; }
  .mark { font-family:Fredoka,sans-serif; font-weight:700; font-size:15px; letter-spacing:-.3px; background:rgba(255,255,255,.16); border-radius:8px; padding:3px 8px; }
  .hdr-title { font-family:Fredoka,sans-serif; font-weight:600; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hdr-right { display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .save-dot { width:9px; height:9px; border-radius:50%; background:#7BE3C2; }
  .save-dot.saving { background:var(--am); } .save-dot.error { background:#FFB3B3; }
  .icon-btn { width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.16); color:#fff; font-size:15px; cursor:pointer; }
  .ava-btn { width:36px; height:36px; border-radius:50%; border:2px solid rgba(255,255,255,.55); background:#fff; color:var(--red);
    font-family:Fredoka,sans-serif; font-weight:700; font-size:13px; cursor:pointer; }

  /* cuerpo */
  .body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#fff; border-radius:20px 20px 0 0;
    padding:14px 10px calc(var(--nav-h) + var(--safe-bot) + 18px); }
  .month-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .month-title { font-family:Fredoka,sans-serif; font-weight:700; font-size:20px; }
  .month-title span { color:var(--red); }
  .nav-btn { border:1.5px solid var(--line); background:#fff; border-radius:12px; width:44px; height:44px; font-size:17px; cursor:pointer; flex-shrink:0; }
  .sub { font-size:12px; color:var(--dim); margin-bottom:10px; }
  .sub.center { text-align:center; }
  .hint { font-size:12px; color:var(--dim); margin:12px 0 0; }
  .muted { color:var(--dim); }

  /* barra de herramientas */
  .tools { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:11px; }
  .btn-tool { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:9px 13px; font-family:Fredoka,sans-serif;
    font-weight:600; font-size:12.5px; cursor:pointer; min-height:40px; }
  .btn-tool.hero { background:var(--red); color:#fff; border-color:var(--red); }

  /* topics */
  .topics-box { border:1.5px solid var(--line); border-radius:14px; padding:9px 11px; margin-bottom:12px; }
  .topics-head { display:flex; align-items:center; justify-content:space-between; font-family:Fredoka,sans-serif; font-weight:600; font-size:13px; }
  .t-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #F4F2EE; cursor:pointer; width:100%;
    background:none; border-left:none; border-right:none; border-top:none; text-align:left; }
  .t-row:last-child { border-bottom:none; }
  .topic-tag { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; background:var(--oferta); border:1.5px dashed var(--ink);
    border-radius:6px; padding:3px 7px; color:var(--ink); max-width:58%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .t-meta { font-size:11px; color:var(--dim); }
  .t-arrow { margin-left:auto; color:var(--dim); font-size:16px; }
  .cbadge { background:#EFEDE8; border-radius:99px; padding:2px 7px; font-size:10px; color:var(--dim); font-family:'IBM Plex Mono',monospace; }

  /* calendario: TODO de altura fija */
  .cal-grid { display:grid; grid-template-columns:26px repeat(7,1fr); gap:4px; }
  .cal-dow { text-align:center; font-family:Fredoka,sans-serif; font-weight:600; font-size:11px; color:var(--dim); padding:2px 0; }
  .cal-dow.cerrado { color:#D4D0C8; text-decoration:line-through; }
  .wk-strip { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .wk-num { font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--red); font-weight:600; }
  .wk-copy { border:1.5px solid var(--line); background:#fff; border-radius:7px; width:26px; height:34px; font-size:11px; color:var(--dim); cursor:pointer; padding:0; }
  .cell { border:none; border-radius:11px; background:#FAF9F7; height:74px; min-width:0; overflow:hidden; padding:5px 4px;
    display:flex; flex-direction:column; font-family:inherit; width:100%; text-align:left; cursor:pointer; }
  .cell:active { background:#F0EDE7; }
  .cell.today { background:#fff; box-shadow:0 0 0 2.5px var(--red) inset; }
  .cell.cerrado { background:repeating-linear-gradient(45deg,#F4F2EE,#F4F2EE 5px,#EAE7E1 5px,#EAE7E1 10px); cursor:default; }
  .cell.prev { background:#FFF9E8; box-shadow:0 0 0 2px var(--am) inset; }
  .cell.kept { box-shadow:0 0 0 2px #CFE8DF inset; }
  .cell.locked { cursor:default; }
  .d { font-family:Fredoka,sans-serif; font-weight:600; font-size:13px; height:17px; flex-shrink:0; display:flex; align-items:center; gap:3px; }
  .fmark { width:13px; height:13px; border-radius:4px; background:var(--red); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:8px;
    font-weight:600; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .nmark { font-size:9px; flex-shrink:0; }
  .smark { color:var(--otro); font-size:10px; flex-shrink:0; }
  .tslot { height:13px; flex-shrink:0; margin-bottom:3px; display:flex; align-items:center; }
  .tstrip { font-family:'IBM Plex Mono',monospace; font-size:7.5px; font-weight:600; background:var(--oferta); border:1px dashed var(--ink);
    border-radius:4px; padding:0 3px; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; line-height:11px; cursor:pointer; }
  .price { font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; border-radius:6px; padding:0 2px; text-align:center;
    letter-spacing:-.3px; white-space:nowrap; overflow:hidden; line-height:14px; height:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .price.off { border:1px dashed var(--red); color:var(--red); background:transparent; }
  .dash { font-size:10px; color:#CFCBC3; text-align:center; height:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cerrado-lab { font-family:'IBM Plex Mono',monospace; font-size:8px; color:#B4AFA6; text-align:center; height:22px; display:flex; align-items:center; justify-content:center; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; }
  .legend b { padding:3px 8px; border-radius:6px; font-weight:600; }

  /* tablas semanales */
  .toggle { display:flex; gap:4px; background:#F4F2EE; border-radius:99px; padding:4px; margin:0 0 12px; }
  .tg { flex:1; border:none; background:transparent; border-radius:99px; padding:10px 6px; font-family:Fredoka,sans-serif; font-weight:600;
    font-size:12px; color:var(--dim); cursor:pointer; }
  .tg.on { background:var(--ink); color:#fff; }
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .wk-table { border-collapse:separate; border-spacing:4px; min-width:560px; }
  .wk-table th { font-family:Fredoka,sans-serif; font-size:11px; color:var(--dim); font-weight:600; text-align:center; padding:2px; }
  .wk-table th.hoy { color:var(--red); }
  .wk-table td { background:#FAF9F7; border-radius:10px; padding:5px 4px; text-align:center; min-width:68px; height:52px; }
  .wk-table .who, .wk-table th.who { position:sticky; left:0; z-index:2; background:#fff; text-align:left; min-width:104px;
    box-shadow:6px 0 6px -5px rgba(0,0,0,.12); }
  .th-topic { display:block; margin:2px auto 0; font-family:'IBM Plex Mono',monospace; font-size:7px; font-weight:600; background:var(--oferta);
    border:1px dashed var(--ink); border-radius:4px; padding:0 3px; max-width:78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cellbtn { border:none; background:transparent; padding:0; width:100%; cursor:pointer; font-family:inherit; }
  .pname { display:flex; align-items:center; gap:7px; }
  .pn { font-family:Fredoka,sans-serif; font-weight:600; font-size:11.5px; line-height:1.1; }
  .ps { font-size:9px; color:var(--dim); }
  .chips { display:flex; gap:3px; justify-content:center; flex-wrap:wrap; }
  .chip { width:25px; height:25px; border-radius:50%; color:#fff; display:inline-flex; align-items:center; justify-content:center;
    font-family:Fredoka,sans-serif; font-weight:700; font-size:10px; border:2px solid transparent; }
  .chip.star { border-color:var(--ink); }
  .sum { border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:14px; font-size:12.5px; }
  .sum-t { font-family:Fredoka,sans-serif; font-weight:600; font-size:13px; margin-bottom:4px; }
  .ok { color:#00584A; } .bad { color:var(--red); }
  .gap { color:var(--red); font-family:'IBM Plex Mono',monospace; font-size:9px; }
  .rowlab { font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600; border-radius:6px; padding:5px 7px; display:inline-block; }
  .avatar { border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:Fredoka,sans-serif; font-weight:700; }
  .person-row { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .person-chip { border:none; background:transparent; padding:0; cursor:pointer; }

  /* cobertura */
  .v-pill { border-radius:99px; padding:8px 13px; font-size:12.5px; font-family:Fredoka,sans-serif; font-weight:600; display:inline-block; margin:0 6px 6px 0; }
  .v-ok { background:#DFF3ED; color:#00584A; } .v-bad { background:#FBE7E7; color:var(--red); }
  .pct-row { margin:8px 0; font-size:13px; }
  .pct-bar { height:9px; background:#EFEDE8; border-radius:99px; overflow:hidden; margin-top:4px; position:relative; }
  .pct-bar > i { position:absolute; top:0; bottom:0; left:0; border-radius:99px; }
  .pct-target { position:absolute; top:-2px; bottom:-2px; width:2.5px; background:var(--ink); }
  .team-summary { border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:16px; font-size:13px; }
  .gaps-title { font-family:Fredoka,sans-serif; font-weight:600; margin-bottom:6px; font-size:13px; }
  .sum-line { display:flex; align-items:center; gap:8px; padding:5px 0; }
  .dot { width:11px; height:11px; border-radius:4px; display:inline-block; flex-shrink:0; }

  /* ajustes */
  .set-card { border:1.5px solid var(--line); border-radius:16px; padding:12px; margin-bottom:12px; }
  .set-head { display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:Fredoka,sans-serif; font-weight:600; font-size:14px; }
  .set-head > div { display:flex; align-items:center; gap:8px; }
  .store-card { border:1.5px dashed var(--line); border-radius:12px; padding:9px 10px 11px; margin-top:10px; }
  .hrow { display:grid; grid-template-columns:44px 1fr 1fr 84px; gap:6px; align-items:center; margin-top:8px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .sw { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; min-height:44px; cursor:pointer; }
  .sw input { width:20px; height:20px; }
  .f-label { display:block; font-size:12px; color:var(--dim); margin:11px 0 5px; font-family:Fredoka,sans-serif; font-weight:600; }
  .f-input { width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 10px; font-size:16px; min-height:44px; background:#fff; }
  .f-input:focus, .note-area:focus { outline:2px solid var(--red); outline-offset:1px; }
  .user-line { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 0; font-family:'IBM Plex Mono',monospace; font-size:11.5px; flex-wrap:wrap; }
  .btn-primary { border:none; background:var(--red); color:#fff; border-radius:12px; padding:13px 20px; font-family:Fredoka,sans-serif;
    font-weight:600; font-size:15px; cursor:pointer; min-height:48px; margin-top:8px; }
  .btn-ghost { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:9px 14px; font-size:13px; cursor:pointer;
    font-family:Fredoka,sans-serif; font-weight:600; min-height:40px; }
  .btn-danger { border:1.5px solid #F2C7C7; background:#FBE7E7; color:var(--red); border-radius:99px; padding:9px 14px; font-size:13px;
    cursor:pointer; font-family:Fredoka,sans-serif; font-weight:600; min-height:40px; }
  .ro-banner, .err-banner { background:#FFF6DE; border:1.5px dashed var(--ink); border-radius:12px; padding:10px 13px; font-size:12.5px; margin-bottom:12px; }
  .err-banner { background:#FBE7E7; border:1.5px solid #F2C7C7; }

  /* barra inferior */
  .nav { position:absolute; left:0; right:0; bottom:0; height:calc(var(--nav-h) + var(--safe-bot)); padding-bottom:var(--safe-bot);
    background:#fff; border-top:1px solid #EDEAE4; display:flex; z-index:20; }
  .nav-item { flex:1; border:none; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:var(--dim); cursor:pointer; font-family:Fredoka,sans-serif; font-weight:600; font-size:10.5px; padding:0; position:relative; }
  .nav-item svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .nav-item.on { color:var(--red); }
  .nav-item.on .pillbg { background:#FBE7E7; }
  .pillbg { border-radius:99px; padding:3px 14px; display:flex; align-items:center; justify-content:center; }

  /* hojas */
  .backdrop { position:absolute; inset:0; background:rgba(29,29,27,.5); display:flex; align-items:flex-end; z-index:40; }
  .sheet { background:#fff; border-radius:22px 22px 0 0; padding:8px 16px calc(20px + var(--safe-bot)); width:100%; max-height:88%; overflow-y:auto; }
  .grab { width:42px; height:5px; border-radius:99px; background:#DFDBD4; margin:0 auto 12px; }
  .sheet-title { font-family:Fredoka,sans-serif; font-weight:700; font-size:17px; margin-bottom:4px; }
  .sheet-note { font-size:12.5px; color:var(--dim); margin-bottom:10px; }
  .sheet-sub { font-family:Fredoka,sans-serif; font-size:12px; color:var(--dim); margin:14px 0 7px; font-weight:600; }
  .type-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
  .type-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:7px; }
  .shift-btn { border:2px solid transparent; border-radius:12px; padding:13px 4px; font-family:'IBM Plex Mono',monospace; font-weight:600;
    font-size:11px; cursor:pointer; min-height:48px; }
  .shift-btn.sel { border-color:var(--ink); }
  .starts { display:flex; flex-wrap:wrap; gap:6px; }
  .start-btn, .chip-btn { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:11px 14px; font-size:13px; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; min-height:44px; }
  .start-btn.sel, .chip-btn.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip-btn.fest-on { background:var(--red); color:#fff; border-color:var(--red); }
  .note-area { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px; font-size:16px; min-height:60px; resize:vertical; }
  .chip-row { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 4px; }
  .chip-i { background:#FAF9F7; border-radius:99px; padding:5px 11px; font-size:11.5px; font-family:'IBM Plex Mono',monospace; color:var(--dim); }
  .desc { background:#FFFCF2; border-left:3px solid var(--am); border-radius:0 10px 10px 0; padding:10px 12px; font-size:13.5px; line-height:1.45;
    margin:12px 0; overflow-wrap:anywhere; }
  .cmt { display:flex; gap:9px; padding:9px 0; border-top:1px solid #F4F2EE; }
  .cmt-b { min-width:0; }
  .cmt-h { font-size:11px; color:var(--dim); }
  .cmt-h b { color:var(--ink); font-family:Fredoka,sans-serif; font-size:12.5px; }
  .cmt-t { font-size:13.5px; line-height:1.4; margin-top:2px; overflow-wrap:anywhere; }
  .composer { display:flex; gap:8px; align-items:flex-end; margin-top:12px; }
  .composer .note-area { min-height:44px; }
  .composer .btn-primary { margin-top:0; flex-shrink:0; padding:13px 16px; }
  .opt-row { display:flex; gap:6px; flex-wrap:wrap; }
  .opt { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:10px 13px; font-size:12.5px; cursor:pointer;
    font-family:'IBM Plex Mono',monospace; min-height:44px; }
  .opt.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
  .stat { display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 4px; }
  .stat span { background:#FAF9F7; border-radius:99px; padding:6px 11px; font-size:11.5px; font-family:'IBM Plex Mono',monospace; }
  .protect { background:#EFF8F4; border-radius:10px; padding:9px 12px; font-size:12px; color:#00584A; margin-top:10px; }

  /* login */
  .login-wrap { flex:1; overflow-y:auto; padding:6dvh 16px calc(20px + var(--safe-bot)); }
  .login-card { background:#fff; border-radius:22px; padding:24px 20px; max-width:400px; margin:0 auto; box-shadow:0 18px 44px rgba(0,0,0,.3); }
  .login-brand { text-align:center; color:var(--red); font-family:Fredoka,sans-serif; font-weight:700; font-size:29px; letter-spacing:-.5px; line-height:1; }
  .login-brand small { display:block; font-size:10px; font-weight:500; letter-spacing:2.5px; opacity:.65; margin-top:4px; }
  .login-sub { color:var(--dim); font-size:13px; text-align:center; margin:6px 0 16px; }
  .auth-err { background:#FBE7E7; color:var(--red); border-radius:10px; padding:9px 12px; font-size:13px; margin-top:10px; }
  .center-msg { padding:40px 20px; text-align:center; color:#fff; font-family:Fredoka,sans-serif; }
  .toast { position:absolute; bottom:calc(var(--nav-h) + var(--safe-bot) + 14px); left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; border-radius:99px; padding:10px 18px; font-size:13px; z-index:60; font-family:Fredoka,sans-serif; font-weight:600; max-width:90%; text-align:center; }

  /* aviso, cumplimiento, actividad */
  .warn { display:flex; align-items:center; gap:10px; background:#FFF3E2; border:1.5px dashed var(--red); border-radius:14px; padding:11px 12px; margin-bottom:12px; }
  .warn-ico { width:30px; height:30px; border-radius:50%; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; font-family:Fredoka,sans-serif; font-weight:700; }
  .warn-t { font-size:12.5px; line-height:1.35; }
  .warn-t b { font-family:Fredoka,sans-serif; }
  .warn-btn { margin-left:auto; border:none; background:var(--red); color:#fff; border-radius:99px; padding:10px 13px; font-family:Fredoka,sans-serif; font-weight:600; font-size:12px; cursor:pointer; flex-shrink:0; }
  .mini-cov { border:1.5px solid var(--line); border-radius:14px; padding:11px 12px; margin-top:14px; }
  .mc-head { font-family:Fredoka,sans-serif; font-weight:600; font-size:13px; margin-bottom:8px; }
  .mc-pills { display:flex; gap:6px; flex-wrap:wrap; }
  .mc-pill { border-radius:99px; padding:6px 11px; font-size:11.5px; font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .ok-i { color:#00A88E; font-weight:700; } .bad-i { color:var(--red); font-weight:700; }
  .search { margin-bottom:10px; }
  .s-input { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:16px; min-height:46px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .fchip { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:8px 13px; font-size:12px; cursor:pointer; font-family:Fredoka,sans-serif; font-weight:600; min-height:38px; }
  .fchip.on { background:var(--ink); color:#fff; border-color:var(--ink); }

const pad = (n) => String(n).padStart(2,"0");

  let fs = sundayOf(new Date(d.getFullYear(),1,1));
  if (d < fs) fs = sundayOf(new Date(d.getFullYear()-1,1,1));

    return { id:p.id||("u"+i), name:p.name||("Advisor "+(i+1)), stores };
  });
  return { regional: c.regional||"Regional LP", warnDays: Math.max(0, Math.min(31, Number(c.warnDays ?? 14))), people: ppl.length?ppl:normConfig(null).people };
}
function normEntry(e, p, dateStr){
  if (!e) return null;
  const out = { ...e };
  if (out.t==="C") out.t = "O";
  if (out.t==="T"){ out.t = "O"; if (out.s==null) out.s = hoursFor(p, out.store||0, parseDate(dateStr)).c - SHIFT_H; }
  if ((out.t==="M"||out.t==="I") && out.s==null) out.s = TIPOS[out.t].base;
  return out;
}

function attach(){
  listenersOn=true; S.loaded=false;
  if (isAdmin()) db.ref("whitelist/"+ekey(ADMIN_EMAIL)).set("regional").catch(()=>{});
  db.ref("config").on("value",(s)=>{ S.config=normConfig(s.val()); S.loaded=true; computeMe(); render(); },

  db.ref("shifts").on("value",(s)=>{ S.shifts=s.val()||{}; render(); },()=>{});
  db.ref("topics").on("value",(s)=>{ S.topics=s.val()||{}; render(); },()=>{});
  db.ref("whitelist").on("value",(s)=>{ S.whitelist=s.val()||{}; computeMe(); render(); },()=>{});

  db.ref("log").limitToLast(400).on("value",(s)=>{ S.log=s.val()||{}; render(); },()=>{});
  db.ref("audits").on("value",(s)=>{ S.audits=s.val()||{}; render(); },()=>{});

function detach(){

/* ── autorrelleno y copiar semana ── */
function buildFill(pid, overwrite, nDias){
  /* 75% Early 9–17 / 25% Mid 11–19, siempre horario estándar. Las semanas partidas entre dos meses
     descuentan lo ya trabajado en el mes vecino para no pasar del límite. */
  const p = personById(pid);
  const dim = daysInMonth(S.ym.y, S.ym.m);
  const fw = new Date(S.ym.y, S.ym.m, 1).getDay();
  const out = {};
  const target = Number(nDias);
  const nWeeks = Math.ceil((fw+dim)/7);
  let g = 0; // contador global de turnos asignados → patrón M M M I exacto
  for (let w=0; w<nWeeks; w++){
    const weekStart = new Date(S.ym.y, S.ym.m, 1 - fw + w*7);
    const cand = [];
    let outsideWorked = 0, fixedWorked = 0;
    for (let k=0; k<7; k++){
      const d = new Date(weekStart); d.setDate(weekStart.getDate()+k);
      const inMonth = d.getMonth()===S.ym.m && d.getFullYear()===S.ym.y;
      const ds = dstr(d);
      const e = normEntry((S.shifts[pid]||{})[ds], p, ds);
      const working = e && ["M","I","O"].includes(e.t);
      if (!inMonth){ if (working) outsideWorked++; continue; }
      if (isClosed(p, 0, d)) continue;
      if (e?.t==="V") continue;
      if (e && !overwrite){ if (working) fixedWorked++; continue; }
      cand.push(d.getDate());
    }
    if (!cand.length) continue;
    const work = Math.max(0, Math.min(target - outsideWorked - fixedWorked, cand.length));
    /* prioridad retail: inicio y fin de mes (cobros) y, dentro de esos tramos,
       sábados y domingos por delante. Empate → rotación normal. */
    const order = cand.map((d,i)=>{
      const wd = new Date(S.ym.y,S.ym.m,d).getDay();
      const peak = d<=5 || d>dim-5;
      let pr = 0;
      if (peak) pr += 3;
      if (peak && (wd===0||wd===6)) pr += 2;
      return { d, pr, rot:(i+w)%cand.length };
    }).sort((a,b)=> b.pr-a.pr || a.rot-b.rot);
    const doWork = new Set(order.slice(0, work).map((x)=>x.d));
    cand.forEach((d)=>{
      const ds = mkDate(d);
      if (!doWork.has(d)){ out[ds] = { t:"L" }; return; }
      const t = (g % 4 === 3) ? "I" : "M";
      g++;
      out[ds] = { t, s: TIPOS[t].base };   // horario estándar siempre: 9–17 / 11–19
    });
  }
  return out;
}
function buildCopy(pid, week, overwrite){
  const p = personById(pid);
  const dim = daysInMonth(S.ym.y, S.ym.m);
  const fw = new Date(S.ym.y, S.ym.m, 1).getDay();
  const out = {};
  for (let d=1; d<=dim; d++){
    if (Math.floor((fw+d-1)/7)!==week+1) continue;
    const date = new Date(S.ym.y,S.ym.m,d);
    if (isClosed(p,0,date)) continue;
    const src = normEntry((S.shifts[pid]||{})[mkDate(d-7)], p, mkDate(Math.max(d-7,1)));
    if (!src || src.t==="V") continue;
    const ds = mkDate(d);
    const ex = normEntry((S.shifts[pid]||{})[ds], p, ds);
    if (ex?.t==="V") continue;
    if (ex && !overwrite) continue;
    const cp = { t:src.t }; if (src.s!=null) cp.s = src.s; if (src.store) cp.store = src.store;
    out[ds] = cp;
  }
  return out;
}
function prevStats(pv){
  const c = { M:0, I:0, O:0, L:0 };
  Object.values(pv).forEach((e)=>{ c[e.t] = (c[e.t]||0)+1; });
  return c;
}

      for (let d=1; d<=dim; d++){

        const e = normEntry((S.shifts[p.id]||{})[ds], p, ds);

        const r = shiftRange(e);
        out += "  "+pad(d)+" "+DIAS[new Date(S.ym.y,S.ym.m,d).getDay()]+" — "+(e.t?TIPOS[e.t].label:"")
             + (r ? " "+hLabel(r[0])+"–"+hLabel(r[1]) : "")

  print(){ window.print(); },
};
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value=text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Resumen copiado"); } catch(e){ toast("No se pudo copiar"); }
  ta.remove();
}

function priceBlock(e, p){
  if (!e) return `<div class="dash">—</div>`;

function calGrid(p, opts){
  const dim = daysInMonth(S.ym.y,S.ym.m);
  const fw = new Date(S.ym.y,S.ym.m,1).getDay();
  const editable = opts.editable;
  let html = `<div class="cal-dow" style="font-size:8px">SEM</div>`;
  for (let i=0;i<7;i++){
    const probe = new Date(S.ym.y,S.ym.m,1+((i-fw)+7)%7);
    html += `<div class="cal-dow ${isClosed(p,0,probe)?"cerrado":""}">${DIAS[i]}</div>`;
  }
  const slots = Array(fw).fill(null).concat(Array.from({length:dim},(_,i)=>i+1));
  while (slots.length%7) slots.push(null);
  const nW = slots.length/7;
  for (let r=0;r<nW;r++){
    const rowDate = new Date(S.ym.y,S.ym.m,1-fw+r*7);
    html += `<div class="wk-strip"><span class="wk-num">S${fiscalWeek(rowDate)}</span>`
      + (editable && r<nW-1 ? `<button class="wk-copy" title="Copiar esta semana a la siguiente" onclick="A.openCopy('${p.id}',${r})">⧉</button>` : "") + `</div>`;
    for (let c=0;c<7;c++){
      const d = slots[r*7+c];
      if (d===null){ html += "<div></div>"; continue; }
      const date = new Date(S.ym.y,S.ym.m,d);
      const ds = mkDate(d);
      if (isClosed(p,0,date)){
        html += `<div class="cell cerrado"><div class="d" style="color:#B4AFA6">${d}</div><div class="tslot"></div><div class="cerrado-lab">CERRADO</div></div>`;
        continue;
      }
      const isPrev = S.preview && S.preview[ds];
      const e = isPrev ? S.preview[ds] : normEntry((S.shifts[p.id]||{})[ds], p, ds);
      const kept = S.preview && !isPrev && (S.shifts[p.id]||{})[ds];
      const tps = topicsForDate(ds);
      const cls = "cell" + (ds===todayStr?" today":"") + (isPrev?" prev":"") + (kept?" kept":"") + (editable?"":" locked");
      const onclick = editable && !S.preview ? `onclick="A.openDate('${p.id}','${ds}')"` : "";
      html += `<button class="${cls}" ${onclick}>
        <div class="d">${d}${dayMarks(e)}</div>
        <div class="tslot">${tps.length?`<span class="tstrip" title="${esc(tps.map((t)=>t.text).join(" · "))}">${tps[0].priv?"🔒 ":""}${esc(tps[0].text.toUpperCase())}</span>`:""}</div>
        ${priceBlock(e,p)}</button>`;
    }
  }
  return `<div class="cal-grid">${html}</div>`;
}

    `<button class="person-chip" onclick="A.view('${p.id}')" title="${esc(p.stores[0].name)}">${avatar(p.name,p.color,38,p.id===activeId)}</button>`).join("") + `</div>`;

function storeSub(p){
  const h = p.stores[0].hours;
  const tr = (x,lab)=> x.x ? lab+" cerrado" : lab+" "+hLabel(x.o)+"–"+hLabel(x.c);
  const sec = p.stores.slice(1).map((s)=>`${esc(s.name)} (${s.pct}%)`).join(", ");
  return `<div class="sub"><b>${esc(p.stores[0].name)}</b> · ${tr(h.wk,"L–V")} · ${tr(h.sa,"Sáb")} · ${tr(h.su,"Dom")}${sec?" · + "+sec:""}</div>`;

function monthStats(p){
  const dim = daysInMonth(S.ym.y,S.ym.m);
  const c = {M:0,I:0,O:0}; let worked=0, planned=0, openDays=0; const sd={};
  for (let d=1; d<=dim; d++){
    const date = new Date(S.ym.y,S.ym.m,d);
    if (isClosed(p,0,date)) continue;
    openDays++;
    const ds = mkDate(d);
    const e = normEntry((S.shifts[p.id]||{})[ds], p, ds);
    if (e) planned++;
    if (e && ["M","I","O"].includes(e.t)){ c[e.t]++; worked++; sd[e.store||0]=(sd[e.store||0]||0)+1; }
  }
  return { c, worked, planned, openDays, sd };
}
function storeCatalog(){
  const map = new Map();
  people().forEach((p)=>p.stores.forEach((st,j)=>{
    const key = st.name.trim().toLowerCase();
    if (!map.has(key)) map.set(key,{ key, name:st.name, principalOf:[], rep:{p,j} });
    const o = map.get(key);
    if (j===0){ o.principalOf.push(p); o.rep = {p,j}; }
  }));
  return [...map.values()];
}
function presence(dayStr){
  const at = {};
  people().forEach((p)=>{
    const e = normEntry((S.shifts[p.id]||{})[dayStr], p, dayStr);
    if (!e || !["M","I","O"].includes(e.t)) return;
    const st = p.stores[e.store||0]; if (!st) return;
    const key = st.name.trim().toLowerCase();
    (at[key] = at[key]||[]).push({ p, star:(e.store||0)>0 });
  });
  return at;
}
function planWarn(p){
  const wd = Number(S.config?.warnDays ?? 14);
  if (!wd) return null;
  if (daysInMonth(now.getFullYear(), now.getMonth()) - now.getDate() > wd) return null;
  let y = now.getFullYear(), m = now.getMonth()+1; if (m>11){ m=0; y++; }
  const dim = daysInMonth(y,m);
  let open=0, planned=0;
  for (let d=1; d<=dim; d++){
    if (isClosed(p,0,new Date(y,m,d))) continue;
    open++;
    if ((S.shifts[p.id]||{})[y+"-"+pad(m+1)+"-"+pad(d)]) planned++;
  }
  return (open && planned/open < .5) ? { y, m, planned, open } : null;
}
function miniCov(p){

      <div class="pct-bar"><i style="width:${Math.min(pct,100)}%;background:${ok?"#00A88E":"#C40D11"}"></i><span class="pct-target" style="left:${Math.min(s2.pct,100)}%"></span></div></div>`;

function hl(s){

function logRow(e){
  const dt = e.at ? new Date(e.at) : null;
  const when = dt ? dt.toLocaleDateString("es-ES",{day:"2-digit",month:"short"})+" "+dt.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) : "";
  const target = e.pid ? (people().find((p)=>p.id===e.pid)?.name||"") : "";

    const f = e.date ? e.date.slice(8)+"/"+e.date.slice(5,7) : "";
    txt = `cambió el <b>${f}</b>${ajeno?" de <b>"+esc(target)+"</b>":""}: ${hl(e.from)} → ${hl(e.to)}`;
  }
  else if (e.kind==="bulk") txt = `aplicó <b>${e.n} días</b> de golpe${ajeno?" a <b>"+esc(target)+"</b>":""} (auto mes / copiar semana) · ${esc(e.month||"")}`;

  else if (e.kind==="cmt") txt = `comentó en <b>${hl(e.text)}</b>`;
  else return "";
  const col = e.byPid==="regional" ? "#C40D11" : (people().find((p)=>p.id===e.byPid)?.color || "#6B675F");

function weekDays(){

function equipoView(){
  const mode = S.eqMode;
  const toggle = `<div class="toggle">${[["personas","Personas"],["turnos","Turnos"],["tiendas","Tiendas"],["cob","Cobertura"]]
    .map(([k,l])=>`<button class="tg ${mode===k?"on":""}" onclick="A.eqMode('${k}')">${l}</button>`).join("")}</div>`;
  if (mode==="cob"){
    const pend = people().filter((p)=>monthStats(p).planned===0);
    const warn = (isAdmin() && pend.length) ? `<div class="warn"><div class="warn-ico">!</div>
        <div class="warn-t"><b>${esc(pend.map((x)=>x.name).join(", "))}</b>: sin planificar ${MESES[S.ym.m].toLowerCase()}.</div></div>` : "";
    const rows = people().map((p)=>{
      const st = monthStats(p);
      const s2 = p.stores[1];
      let sec = `<span class="muted">—</span>`;
      if (s2){
        const days = st.sd[1]||0, pct = st.worked?Math.round(days/st.worked*100):0, ok = pct>=s2.pct;
        sec = `<span class="${ok?"ok-i":"bad-i"}" style="font-family:'IBM Plex Mono',monospace;font-size:11px">${pct}/${s2.pct}%</span>`;
      }
      return `<tr><td class="who"><div class="pname">${avatar(p.name,p.color,26,true)}
          <div><div class="pn">${esc(p.name)}</div><div class="ps">${esc(p.stores[0].name)}</div></div></div></td>
        ${["M","I","O"].map((t)=>`<td><span class="chip" style="background:${st.c[t]?TIPOS[t].color:"#FBE7E7"};color:${st.c[t]?TIPOS[t].ink:"#C40D11"}">${st.c[t]||"✗"}</span></td>`).join("")}
        <td>${sec}</td>
        <td style="font-family:'IBM Plex Mono',monospace;font-size:11px">${st.planned}/${st.openDays}</td></tr>`;
    }).join("");
    return monthNav() + toggle + warn
      + `<div class="scroll"><table class="wk-table" style="min-width:500px"><thead><tr><th class="who">Persona</th><th>Early</th><th>Mid</th><th>Late</th><th>2ª tienda</th><th>Días</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="hint">Cada tipo, al menos una vez al mes. "2ª tienda" = % de visitas frente al objetivo. "Días" = planificados de los abiertos.</p>`;
  }
  const days = weekDays();
  const wk = fiscalWeek(days[0]);
  const nav = `<div class="month-nav"><button class="nav-btn" onclick="A.navW(-1)">←</button>
      <div class="month-title">Semana <span>S${wk}</span></div>
      <button class="nav-btn" onclick="A.navW(1)">→</button></div>
    <div class="sub center">${days[0].getDate()} ${MES3[days[0].getMonth()]} – ${days[6].getDate()} ${MES3[days[6].getMonth()]} ${days[6].getFullYear()}</div>`;
  const head = `<tr><th class="who"></th>${days.map((d)=>{
    const s = dstr(d), tps = topicsForDate(s);
    return `<th class="${s===todayStr?"hoy":""}">${DIAS[d.getDay()]} ${d.getDate()}
      ${tps.length?`<span class="th-topic" title="${esc(tps.map((t)=>t.text).join(" · "))}">${esc(tps[0].text.toUpperCase())}</span>`:""}</th>`;
  }).join("")}</tr>`;
  let body="", hint="", pre="";
  if (mode==="personas"){
    body = people().map((p)=>{
      const cells = days.map((d)=>{
        const s = dstr(d);
        if (isClosed(p,0,d)) return `<td><span class="cerrado-lab">CERRADO</span></td>`;
        const e = normEntry((S.shifts[p.id]||{})[s], p, s);
        let cell = priceBlock(e,p);
        if (e?.store) cell = cell.replace("</div>", "★</div>");
        const wrap = canEdit(p.id) ? `<button class="cellbtn" onclick="A.openDate('${p.id}','${s}')">${cell}</button>` : cell;
        return `<td class="${s===todayStr?"hoy":""}">${wrap}</td>`;
      }).join("");
      return `<tr><td class="who"><div class="pname">${avatar(p.name,p.color,26,true)}
        <div><div class="pn">${esc(p.name)}</div><div class="ps">${esc(p.stores[0].name)}</div></div></div></td>${cells}</tr>`;
    }).join("");
    hint = `<p class="hint">Desliza la tabla: la columna de nombres queda fija. Toca una celda para editar.</p>`;
  } else if (mode==="turnos"){
    body = ["M","I","O"].map((t)=>{
      const cells = days.map((d)=>{
        const s = dstr(d);
        const who = people().map((p)=>({p, e:normEntry((S.shifts[p.id]||{})[s], p, s)})).filter((x)=>x.e?.t===t);
        return `<td class="${s===todayStr?"hoy":""}">${who.length
          ? `<div class="chips">${who.map((x)=>{ const r=shiftRange(x.e);
              return `<span class="chip" style="background:${x.p.color}" title="${esc(x.p.name)} ${hShort(r[0])}–${hShort(r[1])}h">${esc(ini(x.p.name))}</span>`; }).join("")}</div>`
          : `<span class="gap">sin cubrir</span>`}</td>`;
      }).join("");
      return `<tr><td class="who"><span class="rowlab" style="background:${TIPOS[t].color};color:${TIPOS[t].ink}">${TIPOS[t].tag}</span></td>${cells}</tr>`;
    }).join("");
    body += `<tr><td class="who"><span class="rowlab" style="background:#EFEDE8;color:#6B675F">LIBRE · VACAS · FEST</span></td>` +
      days.map((d)=>{
        const s = dstr(d);
        const who = people().map((p)=>({p, e:normEntry((S.shifts[p.id]||{})[s], p, s)}))
          .filter((x)=>x.e && (x.e.t==="L"||x.e.t==="V"||(!x.e.t&&x.e.fest)));
        return `<td class="${s===todayStr?"hoy":""}">${who.length
          ? `<div class="chips">${who.map((x)=>`<span class="chip" style="background:${x.p.color};opacity:.45">${esc(ini(x.p.name))}</span>`).join("")}</div>`
          : `<span class="dash">—</span>`}</td>`;
      }).join("") + `</tr>`;
    hint = `<p class="hint">Cada círculo es una persona. El aviso rojo marca turnos que no cubre nadie ese día.</p>`;
  } else {
    const cat = storeCatalog();
    const pres = days.map((d)=>presence(dstr(d)));
    const gaps = [];
    body = cat.map((o)=>{
      const principal = o.principalOf.length>0;
      const gdays = [];
      const cells = days.map((d,i)=>{
        const s = dstr(d);
        if (hoursFor(o.rep.p, o.rep.j, d).x) return `<td class="cerrado"><span class="cerrado-lab">CERRADO</span></td>`;
        const list = pres[i][o.key]||[];
        if (!list.length){
          if (principal) gdays.push(DIAS[d.getDay()]+" "+d.getDate());
          return `<td class="${s===todayStr?"hoy":""}">${principal?`<span class="gap">sin LP</span>`:`<span class="dash">—</span>`}</td>`;
        }
        return `<td class="${s===todayStr?"hoy":""}"><div class="chips">${list.map((x)=>
          `<span class="chip ${x.star?"star":""}" style="background:${x.p.color}" title="${esc(x.p.name)}${x.star?" (secundaria)":""}">${esc(ini(x.p.name))}</span>`).join("")}</div></td>`;
      }).join("");
      if (principal && gdays.length) gaps.push({ name:o.name, days:gdays });
      const owners = o.principalOf.map((p)=>p.name).join(", ");
      return `<tr><td class="who"><div class="pn">${esc(o.name)}</div><div class="ps">${principal?"principal · "+esc(owners):"adicional"}</div></td>${cells}</tr>`;
    }).join("");
    if (gaps.length && isAdmin())
      pre = `<div class="warn"><div class="warn-ico">!</div><div class="warn-t"><b>Tiendas sin LP esta semana:</b><br>${gaps.map((g)=>esc(g.name)+" ("+g.days.join(", ")+")").join(" · ")}</div></div>`;
    const okList = cat.filter((o)=>o.principalOf.length && !gaps.some((g)=>g.name===o.name)).map((o)=>o.name);
    const addLines = cat.filter((o)=>!o.principalOf.length).map((o)=>{
      const visits = pres.reduce((n,pd)=>n+((pd[o.key]||[]).length?1:0),0);
      return `<div class="sum-line" style="color:var(--dim)">— ${esc(o.name)} (adicional): ${visits} visita${visits===1?"":"s"} esta semana</div>`;
    }).join("");
    hint = `<div class="sum"><div class="sum-t">Resumen de la semana</div>
      ${gaps.map((g)=>`<div class="sum-line bad">✗ ${esc(g.name)} — ${g.days.length} día${g.days.length===1?"":"s"} sin LP (${g.days.join(", ")})</div>`).join("")}
      ${okList.length?`<div class="sum-line ok">✓ ${esc(okList.join(", "))} — cubiertas todos los días que abren</div>`:""}
      ${addLines}</div>
      <p class="hint">Borde negro = visita como secundaria (★). El rojo solo salta en tiendas principales; las adicionales se miden por su % mensual en Cobertura.</p>`;
  }
  return nav + toggle + topicsBox() + pre
    + `<div class="scroll"><table class="wk-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>` + hint + LEGEND;
}

/* ══════════ MERCH PROTECTION AUDIT ══════════ */
const dKey = (i)=>"d"+i;
const depName = (k)=>DEPS[Number(String(k).slice(1))] || k;
function myAuditPid(){ return (S.me==="regional"||S.me==="viewer") ? (S.viewPerson||people()[0]?.id) : S.me; }
function auditList(){
  const out = [];
  Object.entries(S.audits||{}).forEach(([pid,as])=>Object.entries(as||{}).forEach(([id,a])=>{
    if (!isAdmin() && pid!==S.me) return;
    out.push({ pid, id, ...a });
  }));
  return out.sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.at||0)-(a.at||0));
}
function auditById(pid,id){ const a=(S.audits[pid]||{})[id]; return a ? { pid, id, ...a } : null; }
function findsOf(dep){ return Object.entries(dep?.finds||{}).map(([fid,f])=>({ fid, ...f })); }
function auditTotals(a){
  const e = { sin:0, equi:0, mal:0, cons:0 };
  let checked=0, errs=0, money=0, deps=0;
  Object.values(a?.deps||{}).forEach((d)=>{
    deps++; checked += Number(d.checked||0);
    findsOf(d).forEach((f)=>{ e[f.k]=(e[f.k]||0)+1; errs++; money += Number(f.p||0); });
  });
  return { deps, checked, errs, e, money, rate: checked ? errs/checked*100 : 0 };
}
function depTotals(d){
  const e = { sin:0, equi:0, mal:0, cons:0 };
  let money = 0;
  const fs = findsOf(d);
  fs.forEach((f)=>{ e[f.k]=(e[f.k]||0)+1; money += Number(f.p||0); });
  const checked = Number(d?.checked||0);
  return { checked, errs:fs.length, e, money, rate: checked ? fs.length/checked*100 : 0, finds:fs };
}
const money = (n)=> (Number(n)||0).toFixed(2).replace(".",",")+" €";
const rateColor = (r)=> r<=1 ? "#00A88E" : r<=3 ? "#FFC845" : "#C40D11";

function mpaWrite(path, val){
  if (S.demo || !db){ toast("Modo demo: no se guarda"); return Promise.resolve(); }
  setSave("saving");
  return db.ref(path).set(val).then(()=>setSave("ok")).catch((e)=>fbErr(e,"Error al guardar la auditoría"));
}
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = XLSX_URL; s.onload = ()=>res(window.XLSX);
    s.onerror = ()=>rej(new Error("No se pudo cargar el generador de Excel (¿sin conexión?)"));
    document.head.appendChild(s);
  });
}
function auditRows(a){
  const st = (a.store||"").split(" ").pop();
  return DEPS.map((n,i)=>{
    const d = (a.deps||{})[dKey(i)];
    if (!d) return null;
    const t = depTotals(d);
    return { "Store #":st, "Week":a.wk, "Dept":n, "# of items checked":t.checked,
      "# Sin MP":t.e.sin, "# MP equivocado":t.e.equi, "# MP mal colocado":t.e.mal, "# No Consistencia":t.e.cons,
      "% fallo":Number(t.rate.toFixed(2)), "€ expuesto":Number(t.money.toFixed(2)) };
  }).filter(Boolean);
}
function detailRows(a){
  const st = (a.store||"").split(" ").pop();
  const out = [];
  DEPS.forEach((n,i)=>{
    const d = (a.deps||{})[dKey(i)]; if (!d) return;
    findsOf(d).forEach((f)=>out.push({ "Fecha":a.date, "Store #":st, "Week":a.wk, "Dept":n,
      "Tipo":(ERRS.find((x)=>x.k===f.k)||{}).t||f.k, "Descripción":f.n||"", "Precio":Number(f.p||0) }));
  });
  return out;
}
function exportAudit(pid,id){
  const a = auditById(pid,id); if (!a) return;
  S.mpa.busy = true; render();
  loadXLSX().then((X)=>{
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(auditRows(a)), "Compliance");
    const det = detailRows(a);
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(det.length?det:[{ Aviso:"Sin hallazgos" }]), "Detalle");
    X.writeFile(wb, "MPA_"+(a.store||"").replace(/\s+/g,"") + "_" + a.date + ".xlsx");
    S.mpa.busy = false; render();
  }).catch((e)=>{ S.mpa.busy=false; toast(e.message||"No se pudo exportar"); render(); });
}
function exportWeek(wk){
  const list = auditList().filter((a)=>String(a.wk)===String(wk));
  if (!list.length){ toast("No hay auditorías en esa semana"); return; }
  S.mpa.busy = true; render();
  loadXLSX().then((X)=>{
    const wb = X.utils.book_new();
    const resumen = [];
    const byStore = {};
    list.forEach((a)=>{ (byStore[a.store||"—"] = byStore[a.store||"—"]||[]).push(a); });
    Object.entries(byStore).forEach(([store,as])=>{
      let checked=0, errs=0, m=0; const e={sin:0,equi:0,mal:0,cons:0};
      as.forEach((a)=>{ const t=auditTotals(a); checked+=t.checked; errs+=t.errs; m+=t.money;
        ["sin","equi","mal","cons"].forEach((k)=>e[k]+=t.e[k]); });
      resumen.push({ "Tienda":store, "Semana":wk, "Auditorías":as.length, "Prendas revisadas":checked,
        "Fallos":errs, "% fallo":Number((checked?errs/checked*100:0).toFixed(2)),
        "Sin MP":e.sin, "MP equivocado":e.equi, "MP mal colocado":e.mal, "No consistencia":e.cons,
        "€ expuesto":Number(m.toFixed(2)) });
    });
    X.utils.book_append_sheet(wb, X.utils.json_to_sheet(resumen), "Resumen");
    Object.entries(byStore).forEach(([store,as])=>{
      const rows = [];
      as.forEach((a)=>auditRows(a).forEach((r)=>rows.push({ Fecha:a.date, ...r })));
      const name = store.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,30) || "Tienda";
      X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows.length?rows:[{ Aviso:"Sin datos" }]), name);
    });
    X.writeFile(wb, "MPA_semana_S"+wk+".xlsx");
    S.mpa.busy = false; render();
  }).catch((e)=>{ S.mpa.busy=false; toast(e.message||"No se pudo exportar"); render(); });
}

      <thead><tr><th>Depto</th><th>Rev.</th><th>% fallo</th><th>Sin</th><th>Equiv</th><th>Mal</th><th>Cons</th><th>€</th></tr></thead>
      <tbody>${rows}<tr class="tot"><td>TOTAL</td><td>${t.checked}</td><td>${t.rate.toFixed(1)}%</td>
        <td>${t.e.sin}</td><td>${t.e.equi}</td><td>${t.e.mal}</td><td>${t.e.cons}</td>
        <td class="eur bad">${money(t.money)}</td></tr></tbody></table></div>
    <div class="sec-lab">EXPORTAR</div>
    <button class="btn-primary" style="width:100%" onclick="A.mpaExport('${a.pid}','${a.id}')" ${S.mpa.busy?"disabled":""}>
      ${S.mpa.busy?"Generando…":"⤓ Excel de esta auditoría"}</button>
    <button class="btn-ghost" style="width:100%;margin-top:9px" onclick="A.mpaCopy('${a.pid}','${a.id}')">⧉ Copiar resumen</button>
    <p class="hint">El Excel lleva dos hojas: <b>Compliance</b> con tu formato de siempre y <b>Detalle</b> con cada hallazgo y su precio.</p>`);
}
function mpaSheet(){
  if (!S.mpa.pend) return "";
  const editing = !!S.mpa.editFid;
  const E = ERRS.find((x)=>x.k===S.mpa.pend) || ERRS[0];
  const cur = S.mpa.editDraft || { p:"", n:"" };
  return `<div class="backdrop" onclick="A.mpaCancel()"><div class="sheet" onclick="event.stopPropagation()">
    <div class="grab"></div>
    <div class="sheet-title" style="color:${E.c}">${editing?"Editar hallazgo":E.t}</div>
    <div class="sheet-note">${esc(DEPS[S.mpa.dep]||"")}</div>
    ${editing?`<label class="f-label">Tipo de fallo</label>
      <div class="starts">${ERRS.map((x)=>`<button class="chip-btn ${S.mpa.pend===x.k?"sel":""}" onclick="A.mpaSetKind('${x.k}')">${x.t}</button>`).join("")}</div>`:""}
    <label class="f-label" for="mpa-p">Precio de la prenda</label>
    <div class="price-row"><input class="f-input" id="mpa-p" type="text" inputmode="decimal" placeholder="0,00"
      value="${cur.p!==""&&cur.p!=null?String(cur.p).replace(".",","):""}"
      onkeydown="if(event.key==='Enter')A.mpaSaveFind()"><span class="cur">€</span></div>
    <label class="f-label" for="mpa-n">Descripción (opcional)</label>
    <input class="f-input" id="mpa-n" placeholder="Pantalón chino azul" value="${esc(cur.n||"")}">
    <div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap">
      <button class="btn-primary" style="flex:1;margin-top:0" onclick="A.mpaSaveFind()">${editing?"Guardar cambios":"Añadir hallazgo"}</button>
      ${editing?`<button class="btn-ghost" onclick="A.mpaDelFind('${S.mpa.editFid}')">Borrar</button>`:""}
    </div>
  </div></div>`;
}
function mpaView(){
  const v = S.mpa.view;
  return (v==="audit" ? mpaAudit() : v==="dep" ? mpaDepView() : v==="report" ? mpaReportView() : mpaHome()) + mpaSheet();
}
function hubView(){
  const alerts = isAdmin() ? people().filter((p)=>planWarn(p)).length
    : (S.me!=="viewer" && planWarn(personById(S.me)) ? 1 : 0);
  const d = new Date();
  const fecha = DIAS_LARGO[d.getDay()].toLowerCase()+" "+d.getDate()+" de "+MESES[d.getMonth()].toLowerCase();
  const p = (S.me!=="regional" && S.me!=="viewer") ? personById(S.me) : null;
  return `<div class="hub-top">
      <div class="hub-row"><div class="wordmark">LP HUB<small>LOSS PREVENTION</small></div>
        <button class="ava-btn" onclick="A.section('cal');A.tab('set')" title="${esc(myName())}">${esc(ini(myName()))}</button></div>
      <div class="hello">Hola, ${esc(myName())}<span>${p?esc(p.stores[0].name)+" · ":""}${fecha}</span></div>
    </div>
    <div class="hub-body">
      <div class="sec-lab">SECCIONES</div>
      ${SECTIONS.map((s)=>`
        <button class="card ${s.live?"":"soon"}" onclick="A.section('${s.k}')">
          <div class="c-ico" style="background:${s.bg};color:${s.fg}"><svg viewBox="0 0 24 24">${ICONS[s.ico]}</svg></div>
          <div class="c-b"><div class="c-t">${esc(s.t)}
            ${s.live?`<span class="pill p-live">ACTIVO</span>`:`<span class="pill p-soon">PRÓXIMAMENTE</span>`}
            ${s.live&&alerts?`<span class="pill p-alert">${alerts} aviso${alerts>1?"s":""}</span>`:""}</div>
            <div class="c-d">${esc(s.d)}</div></div>
          <span class="c-arrow">›</span></button>`).join("")}
      <div class="foot-note">Las secciones nuevas se añaden aquí sin tocar el calendario: cada una es independiente y se activa cuando esté lista.</div>
    </div>`;
}
function ucView(k){
  const s = SECTIONS.find((x)=>x.k===k) || SECTIONS[1];
  return `<header class="hdr no-print"><div class="hdr-left"><button class="back" onclick="A.hub()">‹</button>
      <span class="hdr-title">${esc(s.t)}</span></div></header>
    <div class="body" id="body" style="padding-bottom:26px">
      <div class="uc"><div class="uc-ico">🚧</div>
        <div class="uc-t">En construcción</div>
        <div class="uc-d">Esta sección aún no está activa. Cuando definas cómo la quieres, se monta aquí sin tocar nada del calendario.</div>
        <div class="uc-list"><b>Ideas para “${esc(s.t)}”</b>
          ${(UC_IDEAS[k]||[]).map((i)=>`<div class="uc-li"><i>›</i>${esc(i)}</div>`).join("")}</div>
        <button class="btn-ghost" style="margin-top:18px" onclick="A.hub()">‹ Volver al Hub</button></div>
    </div>`;
}
function render(){
  const app = document.getElementById("app");
  const prevBody = document.getElementById("body");
  const keepScroll = prevBody ? prevBody.scrollTop : null;
  const keepFocus = document.activeElement && document.activeElement.id ? document.activeElement.id : null;
  if (!S.authReady){ app.innerHTML = `<div class="center-msg">Cargando…</div>`; return; }
  if (!S.user && !S.demo){ app.innerHTML = authView(); return; }
  if (!S.loaded || !S.config){
    app.innerHTML = S.errText
      ? `<div class="login-wrap"><div class="login-card"><div class="err-banner">${esc(S.errText)}</div>
         <button class="btn-ghost" onclick="A.signout()">Cerrar sesión</button></div></div>`
      : `<div class="center-msg">Cargando calendario…</div>`;
    return;
  }
  if (!S.me){ app.innerHTML = `<div class="center-msg">Preparando tu perfil…</div>`; return; }
  if (!S.section){ app.innerHTML = hubView(); return; }
  if (S.section==="mpa"){
    app.innerHTML = mpaView();
    const nbm = document.getElementById("body");
    if (nbm && keepScroll!=null && !S.mpa.pend) nbm.scrollTop = keepScroll;
    return;
  }
  if (S.section!=="cal"){
    app.innerHTML = ucView(S.section);
    const nb0 = document.getElementById("body");
    if (nb0 && keepScroll!=null) nb0.scrollTop = keepScroll;
    return;
  }
  let body = "";
  if (S.tab==="mes") body = mesView();
  else if (S.tab==="equipo") body = equipoView();
  else if (S.tab==="act") body = actividadView();
  else body = ajustesView();
  const banner = S.errText ? `<div class="err-banner no-print">${esc(S.errText)}</div>` : ""
    + (S.demo ? `<div class="ro-banner no-print">Modo demo: los datos no se guardan.</div>` : "");
  app.innerHTML = `
    <header class="hdr no-print">
      <div class="hdr-left"><button class="back" onclick="A.hub()" title="Volver al Hub">‹</button><span class="hdr-title">${TABS[S.tab]}</span></div>
      <div class="hdr-right"><span id="savedot" class="save-dot ${S.saveState}"></span>
        <button class="icon-btn" onclick="A.copy()" title="Copiar resumen">⧉</button>
        <button class="icon-btn" onclick="A.print()" title="Imprimir">⎙</button>
        <button class="ava-btn" onclick="A.tab('set')" title="${esc(myName())}">${esc(ini(myName()))}</button></div>
    </header>
    <div class="body" id="body">${banner}${body}</div>
    <nav class="nav no-print">${Object.keys(TABS).map((k)=>{
      const b = (k==="equipo" && isAdmin()) ? people().filter((p)=>planWarn(p)).length : 0;
      return `<button class="nav-item ${S.tab===k?"on":""}" onclick="A.tab('${k}')">${b?`<span class="badge">${b}</span>`:""}
        <span class="pillbg"><svg viewBox="0 0 24 24">${ICONS[k]}</svg></span>${TABS[k]}</button>`;
    }).join("")}</nav>
    ${sheetHtml()}
    ${printView()}`;
  const nb = document.getElementById("body");
  if (nb && keepScroll!=null) nb.scrollTop = keepScroll;
  if (keepFocus){
    const el = document.getElementById(keepFocus);
    if (el && typeof el.focus==="function" && !S.sheet){
      el.focus({ preventScroll:true });
      if (el.setSelectionRange && ["text","email","password","search","tel","url"].includes(el.type)){
        const n = el.value.length; try { el.setSelectionRange(n,n); } catch(e){}
      }
    }
  }
}

initApp();
render();
</script>
</body>
</html>
