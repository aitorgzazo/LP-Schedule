<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuadrante LP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #F6F7F5; color: #16211C; font-family: Inter, sans-serif; }
  button { font-family: inherit; }
  .brand-mark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px; }
  .brand-mark span { color: #FF5D73; margin-left: 4px; }
  .brand-mark.small { font-size: 19px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px 8px; flex-wrap: wrap; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .me-chip { border: 2px solid #16211C; background: #16211C; color: #fff; border-radius: 99px; padding: 6px 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; }
  .save-dot { width: 10px; height: 10px; border-radius: 50%; background: #2AAF93; display: inline-block; }
  .save-dot.saving { background: #FFC24B; }
  .save-dot.error { background: #E4405A; }
  .tabs { display: flex; gap: 6px; padding: 6px 18px 0; overflow-x: auto; }
  .tab { border: none; background: transparent; padding: 10px 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; color: #7A857D; border-radius: 12px 12px 0 0; cursor: pointer; white-space: nowrap; }
  .tab.on { background: #fff; color: #16211C; box-shadow: 0 -1px 0 #E3E7E3 inset; }
  .content { background: #fff; margin: 0 18px 24px; border-radius: 0 16px 16px 16px; padding: 18px; box-shadow: 0 1px 3px rgba(22,33,28,0.07); }
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 14px; }
  .month-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; }
  .month-title span { color: #9AA59D; font-weight: 500; }
  .nav-btn { border: 2px solid #E3E7E3; background: #fff; border-radius: 10px; width: 36px; height: 36px; font-size: 16px; cursor: pointer; }
  .nav-btn:hover { border-color: #16211C; }
  .person-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .person-chip { border: none; background: transparent; padding: 0; cursor: pointer; }
  .avatar { border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
  .store-line { font-size: 14px; color: #5A645C; margin-bottom: 4px; }
  .ro-tag { margin-left: 8px; background: #EDEFEC; border-radius: 99px; padding: 2px 10px; font-size: 12px; }
  .cal-grid { display: grid; grid-template-columns: 30px repeat(7, 1fr); gap: 5px; }
  .cal-dow { text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px; color: #9AA59D; padding: 4px 0; }
  .wk-cell { display: flex; align-items: center; justify-content: center; font-size: 10px; color: #B8C0BA; font-variant-numeric: tabular-nums; font-weight: 600; }
  .cal-cell { border: 1.5px solid #EDEFEC; border-radius: 12px; background: #fff; padding: 5px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 66px; transition: border-color .12s; font-family: inherit; position: relative; }
  .cal-cell:hover { border-color: #16211C; }
  .cal-cell.locked, .cal-cell.team { cursor: default; }
  .cal-cell.locked:hover, .cal-cell.team:hover { border-color: #EDEFEC; }
  .cal-cell.today { border-color: #FF5D73; }
  .cal-cell.fest { border-color: #FFB3BE; background: #FFFBFB; }
  .cal-day { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 4px; }
  .fest-badge { font-size: 9px; background: #FF5D73; color: #fff; border-radius: 6px; padding: 0 4px; font-family: Inter, sans-serif; font-weight: 600; }
  .note-badge { font-size: 10px; }
  .cal-hours { font-size: 10px; color: #7A857D; font-variant-numeric: tabular-nums; }
  .topic-strip { font-size: 9px; background: #16211C; color: #fff; border-radius: 6px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .daybar { background: #EDEFEC; border-radius: 99px; overflow: hidden; position: relative; }
  .daybar > i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: #5A645C; }
  .legend-item, .team-legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 11px; height: 11px; border-radius: 4px; display: inline-block; flex-shrink: 0; }
  .team-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
  .muted { color: #9AA59D; }
  .hint { font-size: 13px; color: #7A857D; margin-top: 12px; }
  .topics-box { border: 1.5px solid #EDEFEC; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .topics-head { display: flex; align-items: center; justify-content: space-between; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; }
  .topic-line { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; color: #5A645C; }
  .topic-line b { color: #16211C; }
  .cov-week-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
  .cov-week-table th { font-family: 'Space Grotesk', sans-serif; font-size: 12px; color: #9AA59D; text-align: left; padding: 0 8px; }
  .cov-week-table td { background: #F6F7F5; padding: 8px; font-size: 13px; }
  .cov-week-table td:first-child { border-radius: 10px 0 0 10px; font-variant-numeric: tabular-nums; }
  .cov-week-table td:last-child { border-radius: 0 10px 10px 0; }
  .chk { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; border-radius: 8px; font-size: 12px; font-weight: 600; padding: 0 6px; }
  .verdict { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .v-pill { border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .v-ok { background: #EFFAF6; color: #1D6E5A; border: 1.5px solid #C6EADF; }
  .v-bad { background: #FDF3F4; color: #B33049; border: 1.5px solid #F5D8DC; }
  .pct-row { margin: 8px 0; font-size: 13px; }
  .pct-bar { height: 8px; background: #EDEFEC; border-radius: 99px; overflow: hidden; margin-top: 4px; position: relative; }
  .pct-bar > i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; }
  .pct-target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #16211C; }
  .team-summary { border: 1.5px solid #EDEFEC; border-radius: 12px; padding: 10px 12px; margin-top: 16px; font-size: 13px; }
  .gaps-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; margin-bottom: 6px; }
  .pick { display: flex; align-items: center; gap: 12px; border: 2px solid #E3E7E3; background: #fff; border-radius: 16px; padding: 12px 14px; cursor: pointer; transition: border-color .12s; width: 100%; }
  .pick:hover { border-color: #16211C; }
  .pick-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }
  .pick-store { font-size: 13px; color: #7A857D; }
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(22,33,28,0.35); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .sheet { background: #fff; border-radius: 20px 20px 0 0; padding: 18px 18px 26px; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; }
  .sheet-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 12px; }
  .type-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .type-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .shift-btn { border: 2.5px solid transparent; border-radius: 14px; padding: 11px 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }
  .shift-btn.sel { border-color: #16211C; }
  .sheet-sub { font-size: 13px; color: #7A857D; margin: 14px 0 8px; }
  .sheet-starts { display: flex; flex-wrap: wrap; gap: 6px; }
  .start-btn, .chip-btn { border: 1.5px solid #E3E7E3; background: #fff; border-radius: 99px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .start-btn:hover, .chip-btn:hover { border-color: #16211C; }
  .start-btn.sel, .chip-btn.sel { background: #16211C; color: #fff; border-color: #16211C; }
  .chip-btn.fest-on { background: #FF5D73; color: #fff; border-color: #FF5D73; }
  .note-area { width: 100%; border: 1.5px solid #E3E7E3; border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: Inter, sans-serif; min-height: 60px; resize: vertical; }
  .btn-primary { border: none; background: #16211C; color: #fff; border-radius: 12px; padding: 12px 20px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px; }
  .btn-ghost { border: 1.5px solid #E3E7E3; background: #fff; border-radius: 99px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .btn-ghost:hover { border-color: #16211C; }
  .btn-danger { border: 1.5px solid #F5D8DC; background: #FDF3F4; color: #B33049; border-radius: 99px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .f-label { display: block; font-size: 12px; color: #7A857D; margin: 10px 0 4px; }
  .f-input { width: 100%; border: 1.5px solid #E3E7E3; border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: Inter, sans-serif; }
  .f-input:focus { outline: 2px solid #16211C; outline-offset: 1px; }
  .f-input.sm { padding: 6px 8px; font-size: 13px; }
  .settings-card { border: 1.5px solid #EDEFEC; border-radius: 14px; padding: 12px 14px 14px; margin-top: 14px; }
  .settings-card-head { display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; justify-content: space-between; }
  .settings-card-head > div { display: flex; align-items: center; gap: 8px; }
  .store-card { border: 1.5px dashed #E3E7E3; border-radius: 12px; padding: 8px 10px 10px; margin-top: 10px; }
  .hours-grid { display: grid; grid-template-columns: 60px 1fr 1fr; gap: 6px; align-items: center; font-size: 12px; color: #7A857D; margin-top: 6px; }
  .settings-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .ro-banner, .err-banner { background: #FFF6E8; border: 1.5px solid #F1DEBB; border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
  .err-banner { background: #FDF3F4; border-color: #F5D8DC; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #16211C; color: #fff; border-radius: 99px; padding: 10px 18px; font-size: 13px; z-index: 60; }
  .login-wrap { max-width: 420px; margin: 0 auto; padding: 48px 20px; }
  .login-sub { color: #5A645C; font-size: 15px; margin: 10px 0 28px; }
  .login-list { display: flex; flex-direction: column; gap: 10px; }
  .print-only { display: none; }
  @media print {
    .no-print, .toast { display: none !important; }
    .print-only { display: block; padding: 20px; }
    .print-only h1 { font-size: 20px; }
    .print-only h2 { font-size: 14px; margin: 14px 0 6px; }
    .print-only table { border-collapse: collapse; font-size: 11px; }
    .print-only td { border-bottom: 1px solid #ddd; padding: 2px 10px 2px 0; vertical-align: top; }
    .print-block { break-inside: avoid; }
  }
  @media (max-width: 600px) {
    .content { margin: 0 8px 16px; padding: 12px 8px; }
    .topbar { padding: 12px 12px 6px; }
    .tabs { padding: 4px 12px 0; }
    .cal-grid { gap: 3px; grid-template-columns: 22px repeat(7, 1fr); }
    .cal-cell { padding: 4px; min-height: 60px; border-radius: 9px; }
    .cal-hours { font-size: 9px; }
    .topic-strip { font-size: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   CONFIGURACIÓN DE FIREBASE — ya rellenada con el proyecto lp-schedule.
   ═══════════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDyK2xiLByLTxqR8Mfl_v9kwmtZEu-gFV8",
  authDomain: "lp-schedule.firebaseapp.com",
  databaseURL: "https://lp-schedule-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lp-schedule",
  storageBucket: "lp-schedule.firebasestorage.app",
  messagingSenderId: "698909961621",
  appId: "1:698909961621:web:473d27e4d06fe726fada9c"
};
/* ═══════════════════════════════════════════════════════════════════ */

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS = ["D","L","M","X","J","V","S"];               // semana de domingo a sábado
const DIAS_LARGO = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const SHIFT_H = 8;
const PERSON_COLORS = ["#FF5D73","#4B9BFF","#FFAA3B","#9B6BFF","#2AAF93","#E86FC1","#7A857D","#C9A227"];
const TIPOS = {
  M: { label: "Mañana", short: "Mañana 9–17", color: "#FFC24B", ink: "#5C4300", base: 9,  starts: [8, 9, 10] },
  I: { label: "Mid",    short: "Mid 11–19",   color: "#39C0A8", ink: "#00382E", base: 11, starts: [10, 11, 12] },
  O: { label: "Tarde/Otro", short: "Tarde / Otro", color: "#6C63FF", ink: "#FFFFFF", base: 14, starts: null },
  L: { label: "Libre",  color: "#E3E7E3", ink: "#5A645C" },
  V: { label: "Vacaciones", color: "#8FD98F", ink: "#1D4D1D" },
};
const FEST_COLOR = "#FF5D73";
const DEF_HOURS = { wk: { o: 10, c: 22 }, sa: { o: 10, c: 22 }, su: { o: 10, c: 22 } };
const DEFAULT_CONFIG = {
  regional: "Regional LP",
  people: [
    { id: "p1", name: "Aitor",     stores: [{ name: "Alfafar 1004", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] },
    { id: "p2", name: "Advisor 2", stores: [{ name: "Tienda 2", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] },
    { id: "p3", name: "Advisor 3", stores: [{ name: "Tienda 3", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] },
    { id: "p4", name: "Advisor 4", stores: [{ name: "Tienda 4", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] },
  ],
};

/* ── estado ── */
const now = new Date();
const S = {
  config: null, shifts: {}, topics: {},
  me: null, tab: "mes", viewPerson: null,
  ym: { y: now.getFullYear(), m: now.getMonth() },
  sheet: null,          // {pid, d, draft:{t,s,store,fest,note}}
  topicSheet: false,
  cfgDraft: null,
  saveState: "ok", demo: false, errText: null, loaded: false,
};

/* ── normalización (compatibilidad con datos de la v1) ── */
function normHours(h) {
  const one = (x, def) => ({ o: Number(x?.o ?? def.o), c: Number(x?.c ?? def.c) });
  h = h || {};
  return { wk: one(h.wk, DEF_HOURS.wk), sa: one(h.sa, DEF_HOURS.sa), su: one(h.su, DEF_HOURS.su) };
}
function normConfig(c) {
  c = c || JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  const people = (Array.isArray(c.people) ? c.people : Object.values(c.people || {})).map((p, i) => {
    let stores = p.stores;
    if (!stores) {
      const h = p.open != null ? { wk: { o: p.open, c: p.close }, sa: { o: p.open, c: p.close }, su: { o: p.open, c: p.close } } : null;
      stores = [{ name: p.store || "Tienda", pct: 0, hours: h }];
    }
    stores = (Array.isArray(stores) ? stores : Object.values(stores)).map((st) => ({
      name: st.name || "Tienda", pct: Number(st.pct || 0), hours: normHours(st.hours),
    }));
    return { id: p.id || "u" + i, name: p.name || "Advisor " + (i + 1), stores };
  });
  return { regional: c.regional || "Regional LP", people };
}
function normEntry(e, p, dateStr) {
  if (!e) return null;
  const out = { ...e };
  if (out.t === "C") { out.t = "O"; }
  if (out.t === "T") {
    out.t = "O";
    if (out.s == null) {
      const hrs = hoursForDate(p, out.store || 0, parseDate(dateStr));
      out.s = hrs.c - SHIFT_H;
    }
  }
  if ((out.t === "M" || out.t === "I") && out.s == null) out.s = TIPOS[out.t].base;
  return out;
}

/* ── Firebase o modo demo ── */
let db = null;
const isDemo = () => JSON.stringify(FIREBASE_CONFIG).includes("PEGA_AQUI");
function initData() {
  if (isDemo()) {
    S.demo = true; S.config = normConfig(null); S.loaded = true; render(); return;
  }
  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); }
  catch (e) {
    S.errText = "No se pudo iniciar Firebase: " + (e.message || e);
    S.config = normConfig(null); S.loaded = true; render(); return;
  }
  db.ref("config").on("value", (snap) => {
    S.config = normConfig(snap.val());
    S.loaded = true; render();
  }, (err) => {
    S.errText = "Sin acceso a la base de datos (revisa las reglas): " + (err.message || err);
    S.config = normConfig(null); S.loaded = true; render();
  });
  db.ref("shifts").on("value", (snap) => { S.shifts = snap.val() || {}; render(); });
  db.ref("topics").on("value", (snap) => { S.topics = snap.val() || {}; render(); });
}
function setSave(state) { S.saveState = state; const el = document.getElementById("savedot"); if (el) el.className = "save-dot " + state; }
function fbError(e, ctx) { setSave("error"); S.errText = ctx + ": " + (e.message || e); render(); }

function writeShift(pid, date, entry) {
  if (!S.shifts[pid]) S.shifts[pid] = {};
  if (entry) S.shifts[pid][date] = entry; else delete S.shifts[pid][date];
  render();
  if (S.demo || !db) return;
  setSave("saving");
  const ref = db.ref("shifts/" + pid + "/" + date);
  (entry ? ref.set(entry) : ref.remove()).then(() => setSave("ok")).catch((e) => fbError(e, "Error al guardar el turno"));
}
function writeConfig(cfg) {
  S.config = cfg; render();
  if (S.demo || !db) { toast("Guardado (modo demo, se pierde al recargar)"); return; }
  setSave("saving");
  db.ref("config").set(cfg).then(() => { setSave("ok"); toast("Ajustes guardados"); }).catch((e) => fbError(e, "Error al guardar ajustes"));
}
function writeTopic(t) {
  if (S.demo || !db) {
    S.topics["local" + Date.now()] = t; render(); toast("Topic añadido (modo demo)"); return;
  }
  setSave("saving");
  db.ref("topics").push(t).then(() => setSave("ok")).catch((e) => fbError(e, "Error al guardar el topic"));
}
function deleteTopic(id) {
  if (S.demo || !db) { delete S.topics[id]; render(); return; }
  db.ref("topics/" + id).remove().catch((e) => fbError(e, "Error al borrar el topic"));
}

/* ── utilidades ── */
const pad = (n) => String(n).padStart(2, "0");
const hLabel = (h) => { const hh = ((h % 24) + 24) % 24; return pad(Math.floor(hh)) + ":" + (h % 1 ? "30" : "00"); };
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const mkDate = (d) => S.ym.y + "-" + pad(S.ym.m + 1) + "-" + pad(d);
const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function people() { return (S.config?.people || []).map((p, i) => ({ ...p, color: PERSON_COLORS[i % PERSON_COLORS.length] })); }
function personById(pid) { return people().find((x) => x.id === pid) || people()[0]; }
const canEdit = (pid) => S.me === "regional" || S.me === pid;

/* horario de la tienda según el día: entre semana / sábado / domingo */
function hoursForDate(p, storeIdx, date) {
  const st = p.stores[storeIdx] || p.stores[0];
  const wd = date.getDay();
  return wd === 0 ? st.hours.su : wd === 6 ? st.hours.sa : st.hours.wk;
}

/* semana fiscal TK Maxx: semana 1 = la (dom–sáb) que contiene el 1 de febrero */
function sundayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }
function fiscalWeek(d) {
  let fs = sundayOf(new Date(d.getFullYear(), 1, 1));
  if (d < fs) fs = sundayOf(new Date(d.getFullYear() - 1, 1, 1));
  return Math.round((sundayOf(d) - fs) / (7 * 86400000)) + 1;
}

function shiftRange(entry) {
  if (!entry || !["M", "I", "O"].includes(entry.t)) return null;
  const s = entry.s ?? TIPOS[entry.t].base;
  return [s, s + SHIFT_H];
}
function topicsForDate(dateStr) {
  return Object.entries(S.topics || {})
    .filter(([, t]) => t.from <= dateStr && dateStr <= t.to)
    .map(([id, t]) => ({ id, ...t }));
}

function avatar(name, color, size, active) {
  const initials = (name || "?").split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  const st = active ? `background:${color};color:#fff;border:2px solid ${color}` : `background:#fff;color:${color};border:2px solid ${color}`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px;${st}">${esc(initials)}</div>`;
}

function dayBar(entry, p, dateStr, height) {
  const date = parseDate(dateStr);
  const hrs = hoursForDate(p, entry?.store || 0, date);
  const lo = hrs.o - 2, hi = hrs.c, span = hi - lo;
  let inner = "";
  if (entry && (entry.t === "L" || entry.t === "V")) {
    inner = `<i style="left:0;width:100%;background:${TIPOS[entry.t].color};opacity:${entry.t === "L" ? 0.9 : 1}"></i>`;
  } else if (entry && !entry.t && entry.fest) {
    inner = `<i style="left:0;width:100%;background:${FEST_COLOR};opacity:.25"></i>`;
  } else {
    const r = shiftRange(entry);
    if (r) {
      const a = Math.max(r[0], lo), b = Math.min(r[1], hi);
      if (b > a) inner = `<i style="left:${((a - lo) / span) * 100}%;width:${((b - a) / span) * 100}%;background:${TIPOS[entry.t].color}"></i>`;
    }
  }
  return `<div class="daybar" style="height:${height}px">${inner}</div>`;
}

function legendHtml() {
  return `<div class="legend">
    ${["M", "I", "O", "L", "V"].map((k) => `<div class="legend-item"><span class="dot" style="background:${TIPOS[k].color}"></span>${TIPOS[k].short || TIPOS[k].label}</div>`).join("")}
    <div class="legend-item"><span class="dot" style="background:${FEST_COLOR}"></span>Festivo</div>
  </div>`;
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

/* ── acciones ── */
window.A = {
  pick(id) { S.me = id; S.viewPerson = id === "regional" ? people()[0].id : id; render(); },
  logout() { S.me = null; S.tab = "mes"; S.cfgDraft = null; render(); },
  tab(t) { S.tab = t; if (t === "ajustes") S.cfgDraft = JSON.parse(JSON.stringify(S.config)); render(); },
  view(pid) { S.viewPerson = pid; render(); },
  nav(dir) { let { y, m } = S.ym; m += dir; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.ym = { y, m }; render(); },

  /* editor de día */
  openDay(pid, d) {
    if (!canEdit(pid)) return;
    const cur = (S.shifts[pid] || {})[mkDate(d)];
    S.sheet = { pid, d, draft: cur ? { ...normEntry(cur, personById(pid), mkDate(d)) } : {} };
    render();
  },
  closeSheet() { S.sheet = null; S.topicSheet = false; render(); },
  _grabNote() { const ta = document.getElementById("sheet-note"); if (ta && S.sheet) S.sheet.draft.note = ta.value; },
  sd(t) {
    A._grabNote();
    const dr = S.sheet.draft;
    if (dr.t === t) { delete dr.t; delete dr.s; }
    else {
      dr.t = t;
      if (t === "M" || t === "I") dr.s = TIPOS[t].base;
      else if (t === "O") {
        const p = personById(S.sheet.pid);
        dr.s = hoursForDate(p, dr.store || 0, parseDate(mkDate(S.sheet.d))).c - SHIFT_H;
      } else { delete dr.s; }
    }
    render();
  },
  sdStart(s) { A._grabNote(); S.sheet.draft.s = s; render(); },
  sdStore(i) { A._grabNote(); S.sheet.draft.store = i; render(); },
  sdFest() { A._grabNote(); S.sheet.draft.fest = S.sheet.draft.fest ? 0 : 1; render(); },
  saveSheet() {
    A._grabNote();
    const { pid, d, draft } = S.sheet;
    const entry = {};
    if (draft.t) { entry.t = draft.t; if (draft.s != null && draft.t !== "L" && draft.t !== "V") entry.s = draft.s; }
    if (draft.store) entry.store = draft.store;
    if (draft.fest) entry.fest = 1;
    if (draft.note && draft.note.trim()) entry.note = draft.note.trim();
    writeShift(pid, mkDate(d), Object.keys(entry).length ? entry : null);
    S.sheet = null; render();
  },
  clearDay() { const { pid, d } = S.sheet; writeShift(pid, mkDate(d), null); S.sheet = null; render(); },

  /* topics */
  openTopic() { S.topicSheet = true; render(); },
  saveTopic() {
    const from = document.getElementById("tp-from").value;
    const to = document.getElementById("tp-to").value || from;
    const text = document.getElementById("tp-text").value.trim();
    if (!from || !text) { toast("Falta la fecha o el texto"); return; }
    const meName = S.me === "regional" ? S.config.regional : personById(S.me)?.name;
    writeTopic({ from, to: to < from ? from : to, text, by: meName || "" });
    S.topicSheet = false; render();
  },
  delTopic(id) { if (confirm("¿Borrar este topic para todo el equipo?")) deleteTopic(id); },

  /* ajustes */
  syncCfg() {
    const d = S.cfgDraft;
    const g = (id) => document.getElementById(id);
    if (g("cd-reg")) d.regional = g("cd-reg").value.trim() || "Regional LP";
    d.people.forEach((p, i) => {
      if (g(`cd-p${i}-name`)) p.name = g(`cd-p${i}-name`).value.trim() || "Advisor " + (i + 1);
      p.stores.forEach((st, j) => {
        const q = (suf) => g(`cd-p${i}-s${j}-${suf}`);
        if (!q("name")) return;
        st.name = q("name").value.trim() || "Tienda";
        st.pct = Math.max(0, Math.min(100, Number(q("pct")?.value || 0)));
        st.hours = {
          wk: { o: Number(q("wko").value), c: Number(q("wkc").value) },
          sa: { o: Number(q("sao").value), c: Number(q("sac").value) },
          su: { o: Number(q("suo").value), c: Number(q("suc").value) },
        };
      });
    });
  },
  addPerson() { A.syncCfg(); S.cfgDraft.people.push({ id: "u" + Date.now(), name: "", stores: [{ name: "", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] }); render(); },
  delPerson(i) {
    if (!confirm("¿Eliminar este advisor? Sus turnos guardados dejarán de mostrarse.")) return;
    A.syncCfg(); S.cfgDraft.people.splice(i, 1); render();
  },
  addStore(i) { A.syncCfg(); S.cfgDraft.people[i].stores.push({ name: "", pct: 20, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }); render(); },
  delStore(i, j) { A.syncCfg(); S.cfgDraft.people[i].stores.splice(j, 1); render(); },
  saveSettings() { A.syncCfg(); writeConfig(normConfig(S.cfgDraft)); },

  copy() {
    const ps = people(); const dim = daysInMonth(S.ym.y, S.ym.m);
    let out = "CUADRANTE LP — " + MESES[S.ym.m].toUpperCase() + " " + S.ym.y + "\n";
    for (const p of ps) {
      out += "\n" + p.name + " · " + p.stores[0].name + "\n";
      const entries = S.shifts[p.id] || {};
      for (let d = 1; d <= dim; d++) {
        const e = normEntry(entries[mkDate(d)], p, mkDate(d));
        if (!e) continue;
        const r = shiftRange(e);
        const wd = DIAS[new Date(S.ym.y, S.ym.m, d).getDay()];
        const stName = e.store ? " @ " + (p.stores[e.store]?.name || "") : "";
        out += "  " + pad(d) + " " + wd + " — " + (e.t ? TIPOS[e.t].label : "") + (r ? " " + hLabel(r[0]) + "–" + hLabel(r[1]) : "")
             + stName + (e.fest ? " [FESTIVO]" : "") + (e.note ? " · " + e.note : "") + "\n";
      }
    }
    const done = () => toast("Resumen copiado");
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(out).then(done, () => fallbackCopy(out));
    else fallbackCopy(out);
  },
  print() { window.print(); },
};
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Resumen copiado"); } catch (e) { toast("No se pudo copiar"); }
  ta.remove();
}

/* rejilla de 8 columnas: nº de semana fiscal + 7 días (D–S) */
function calGrid(renderCell) {
  const dim = daysInMonth(S.ym.y, S.ym.m);
  const fw = new Date(S.ym.y, S.ym.m, 1).getDay(); // domingo = 0
  let html = `<div class="cal-dow" style="font-size:10px">SEM</div>` + DIAS.map((d) => `<div class="cal-dow">${d}</div>`).join("");
  const slots = [];
  for (let i = 0; i < fw; i++) slots.push(null);
  for (let d = 1; d <= dim; d++) slots.push(d);
  while (slots.length % 7) slots.push(null);
  for (let r = 0; r < slots.length / 7; r++) {
    const rowDate = new Date(S.ym.y, S.ym.m, 1 - fw + r * 7);
    html += `<div class="wk-cell" title="Semana fiscal">S${fiscalWeek(rowDate)}</div>`;
    for (let c = 0; c < 7; c++) {
      const d = slots[r * 7 + c];
      html += d === null ? "<div></div>" : renderCell(d);
    }
  }
  return `<div class="cal-grid">${html}</div>`;
}

function coberturaView() {
  const p = personById(S.viewPerson);
  const entries = S.shifts[p.id] || {};
  const dim = daysInMonth(S.ym.y, S.ym.m);
  /* recuento por semana fiscal y tipo */
  const weeks = new Map(); // wk -> {M,I,O, from,to}
  const monthTotals = { M: 0, I: 0, O: 0 };
  let workedDays = 0; const storeDays = {};
  for (let d = 1; d <= dim; d++) {
    const date = new Date(S.ym.y, S.ym.m, d);
    const wk = fiscalWeek(date);
    if (!weeks.has(wk)) weeks.set(wk, { M: 0, I: 0, O: 0, from: d, to: d });
    weeks.get(wk).to = d;
    const e = normEntry(entries[mkDate(d)], p, mkDate(d));
    if (e && ["M", "I", "O"].includes(e.t)) {
      weeks.get(wk)[e.t]++; monthTotals[e.t]++; workedDays++;
      storeDays[e.store || 0] = (storeDays[e.store || 0] || 0) + 1;
    }
  }
  const rows = [...weeks.entries()].map(([wk, w]) => `
    <tr>
      <td>S${wk} <span class="muted">(${w.from}–${w.to})</span></td>
      ${["M", "I", "O"].map((t) => `<td><span class="chk" style="background:${w[t] ? TIPOS[t].color : "#EDEFEC"};color:${w[t] ? TIPOS[t].ink : "#9AA59D"}">${w[t] || "·"}</span></td>`).join("")}
    </tr>`).join("");
  const verdict = ["M", "I", "O"].map((t) => monthTotals[t]
    ? `<span class="v-pill v-ok">✓ ${TIPOS[t].label}: ${monthTotals[t]} este mes</span>`
    : `<span class="v-pill v-bad">✗ Falta hacer ${TIPOS[t].label} este mes</span>`).join("");
  /* cumplimiento de tiendas secundarias */
  let storesHtml = "";
  if (p.stores.length > 1) {
    storesHtml = `<div class="gaps-title" style="margin-top:16px">Visitas a tiendas (${workedDays} días trabajados)</div>` +
      p.stores.map((st, j) => {
        const days = storeDays[j] || 0;
        const pct = workedDays ? Math.round((days / workedDays) * 100) : 0;
        if (j === 0) return `<div class="pct-row">${esc(st.name)} <span class="muted">· principal · ${days} días (${pct}%)</span></div>`;
        const ok = pct >= st.pct;
        return `<div class="pct-row">${esc(st.name)} · ${days} días (${pct}%) — objetivo ${st.pct}% ${ok ? "✓" : "✗"}
          <div class="pct-bar"><i style="width:${Math.min(pct, 100)}%;background:${ok ? "#2AAF93" : "#E4405A"}"></i><span class="pct-target" style="left:${Math.min(st.pct, 100)}%"></span></div>
        </div>`;
      }).join("");
  }
  /* resumen del equipo */
  const teamHtml = `<div class="team-summary"><div class="gaps-title">Resumen del equipo · ${MESES[S.ym.m]}</div>` +
    people().map((q) => {
      const ent = S.shifts[q.id] || {};
      const tot = { M: 0, I: 0, O: 0 }; let wd = 0; const sd = {};
      for (let d = 1; d <= dim; d++) {
        const e = normEntry(ent[mkDate(d)], q, mkDate(d));
        if (e && ["M", "I", "O"].includes(e.t)) { tot[e.t]++; wd++; sd[e.store || 0] = (sd[e.store || 0] || 0) + 1; }
      }
      const missing = ["M", "I", "O"].filter((t) => !tot[t]).map((t) => TIPOS[t].label);
      const storeFail = q.stores.slice(1).filter((st, j) => wd && Math.round(((sd[j + 1] || 0) / wd) * 100) < st.pct).map((st) => st.name);
      const probs = [...missing.map((m) => "falta " + m), ...storeFail.map((s) => "visitas a " + s)];
      return `<div class="topic-line"><span class="dot" style="background:${q.color}"></span>${esc(q.name)}: ${probs.length ? '<span style="color:#B33049">' + esc(probs.join(", ")) + "</span>" : '<span style="color:#1D6E5A">todo cubierto ✓</span>'}</div>`;
    }).join("") + `</div>`;
  return personRow(p.id) + monthNav()
    + `<div class="cov-scroll"><table class="cov-week-table">
        <thead><tr><th>Semana</th>${["M", "I", "O"].map((t) => `<th>${TIPOS[t].label}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="verdict">${verdict}</div>` + storesHtml + teamHtml;
}

            <input class="f-input sm" id="cd-p${i}-s${j}-name" value="${esc(st.name)}">
            ${j > 0 ? `<label class="f-label">% de visitas objetivo (sobre días trabajados del mes)</label>
            <input class="f-input sm" id="cd-p${i}-s${j}-pct" type="number" min="0" max="100" value="${st.pct}">`
            : `<input type="hidden" id="cd-p${i}-s${j}-pct" value="0">`}
            ${hoursInputs(i, j, st)}
          </div>`).join("")}
        <button class="btn-ghost" style="margin-top:10px" onclick="A.addStore(${i})">＋ Añadir tienda</button>
      </div>`).join("")}
    <div class="settings-actions">
      <button class="btn-ghost" onclick="A.addPerson()">＋ Añadir advisor</button>
    </div>
    <button class="btn-primary" onclick="A.saveSettings()">Guardar ajustes</button>
    <div class="settings-actions">
      <button class="btn-ghost" onclick="A.logout()">Cambiar de usuario</button>
    </div>
  </div>`;
}

function sheetView() {
  if (S.topicSheet) {
    const def = mkDate(Math.min(now.getDate(), daysInMonth(S.ym.y, S.ym.m)));
    return `<div class="sheet-backdrop" onclick="A.closeSheet()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-title">Nuevo topic (visible para todos)</div>
        <label class="f-label" for="tp-from">Desde</label><input class="f-input" id="tp-from" type="date" value="${def}">
        <label class="f-label" for="tp-to">Hasta (opcional, para periodos)</label><input class="f-input" id="tp-to" type="date" value="${def}">
        <label class="f-label" for="tp-text">Topic</label><input class="f-input" id="tp-text" placeholder="Inventario, visita regional, campaña…">
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn-primary" style="margin-top:0" onclick="A.saveTopic()">Guardar</button>
          <button class="btn-ghost" onclick="A.closeSheet()">Cancelar</button>
        </div>
      </div></div>`;
  }
  if (!S.sheet) return "";
  const p = personById(S.sheet.pid);
  const d = S.sheet.d, dr = S.sheet.draft;
  const date = parseDate(mkDate(d));
  const wd = DIAS_LARGO[date.getDay()];
  const hrs = hoursForDate(p, dr.store || 0, date);
  const typeBtn = (t) => {
    const tp = TIPOS[t];
    return `<button class="shift-btn ${dr.t === t ? "sel" : ""}" style="background:${tp.color};color:${tp.ink}" onclick="A.sd('${t}')">${tp.short || tp.label}</button>`;
  };
  let starts = "";
  if (dr.t === "M" || dr.t === "I") {
    starts = TIPOS[dr.t].starts.map((h) =>
      `<button class="start-btn ${dr.s === h ? "sel" : ""}" onclick="A.sdStart(${h})">${hLabel(h)}–${hLabel(h + 8)}</button>`).join("");
  } else if (dr.t === "O") {
    const opts = [];
    for (let h = hrs.o - 2; h <= hrs.c - SHIFT_H + 2; h++) opts.push(h);
    starts = opts.map((h) =>
      `<button class="start-btn ${dr.s === h ? "sel" : ""}" onclick="A.sdStart(${h})">${hLabel(h)}–${hLabel(h + 8)}</button>`).join("");
  }
  return `<div class="sheet-backdrop" onclick="A.closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-title">${wd} ${d} · ${esc(p.name)}</div>
      <div class="type-grid">${typeBtn("M")}${typeBtn("I")}${typeBtn("O")}</div>
      <div class="type-grid2">${typeBtn("L")}${typeBtn("V")}</div>
      ${starts ? `<div class="sheet-sub">Hora del turno (8 h) — vuelve a tocar el tipo para quitarlo</div><div class="sheet-starts">${starts}</div>` : ""}
      ${p.stores.length > 1 ? `<div class="sheet-sub">¿En qué tienda?</div><div class="sheet-starts">
        ${p.stores.map((st, j) => `<button class="chip-btn ${(dr.store || 0) === j ? "sel" : ""}" onclick="A.sdStore(${j})">${esc(st.name)}</button>`).join("")}</div>` : ""}
      <div class="sheet-sub">Extras</div>
      <div class="sheet-starts">
        <button class="chip-btn ${dr.fest ? "fest-on" : ""}" onclick="A.sdFest()">${dr.fest ? "✓ " : ""}Festivo${dr.fest && !dr.t ? " (no trabajado)" : ""}</button>
      </div>
      <div class="sheet-sub">Nota / comentario del día (visible para todos: cambios de horario, hot topics…)</div>
      <textarea class="note-area" id="sheet-note" placeholder="Ej.: cambio a Mid por auditoría; revisar mermas sección 4…">${esc(dr.note || "")}</textarea>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="btn-primary" style="margin-top:0" onclick="A.saveSheet()">Guardar día</button>
        <button class="btn-ghost" onclick="A.clearDay()">Vaciar día</button>
        <button class="btn-ghost" onclick="A.closeSheet()">Cerrar</button>
      </div>
    </div>
  </div>`;
}

function printView() {
  const ps = people(); const dim = daysInMonth(S.ym.y, S.ym.m);
  return `<div class="print-only"><h1>Cuadrante LP — ${MESES[S.ym.m]} ${S.ym.y}</h1>` +
    ps.map((p) => {
      const entries = S.shifts[p.id] || {};
      let rows = "";
      for (let d = 1; d <= dim; d++) {
        const e = normEntry(entries[mkDate(d)], p, mkDate(d));
        const r = shiftRange(e);
        const stName = e?.store ? " @ " + esc(p.stores[e.store]?.name || "") : "";
        rows += `<tr><td>S${fiscalWeek(new Date(S.ym.y, S.ym.m, d))} · ${pad(d)} ${DIAS[new Date(S.ym.y, S.ym.m, d).getDay()]}</td>
          <td>${e?.t ? TIPOS[e.t].label : e?.fest ? "Festivo" : "—"}${e?.fest && e?.t ? " (festivo)" : ""}</td>
          <td>${r ? hLabel(r[0]) + "–" + hLabel(r[1]) : ""}${stName}</td>
          <td>${esc(e?.note || "")}</td></tr>`;
      }
      return `<div class="print-block"><h2>${esc(p.name)} · ${esc(p.stores[0].name)}</h2><table><tbody>${rows}</tbody></table></div>`;
    }).join("") + `</div>`;
}

/* ── render principal ── */
function render() {
  const app = document.getElementById("app");
  if (!S.loaded || !S.config) {
    app.innerHTML = `<div style="padding:60px;text-align:center;color:#7A857D">Cargando cuadrante…</div>`;
    return;
  }
  if (!S.me) { app.innerHTML = loginView(); return; }
  const meName = S.me === "regional" ? S.config.regional : (personById(S.me)?.name || "");
  const banners =
    (S.errText ? `<div class="err-banner no-print"><div style="font-family:monospace;font-size:12px;margin:2px 0">${esc(S.errText)}</div></div>` : "") +
    (S.demo ? `<div class="ro-banner no-print">Modo demo: sin Firebase configurado, los datos se pierden al recargar.</div>` : "");
  let body = "";
  if (S.tab === "mes") body = mesView();
  else if (S.tab === "equipo") body = equipoView();
  else if (S.tab === "cobertura") body = coberturaView();
  else body = ajustesView();
  app.innerHTML = `
    <header class="topbar no-print">
      <div class="brand-mark small">CUADRANTE<span>LP</span></div>
      <div class="topbar-right">
        <span id="savedot" class="save-dot ${S.saveState}"></span>
        <button class="btn-ghost" onclick="A.copy()">Copiar resumen</button>
        <button class="btn-ghost" onclick="A.print()">Imprimir</button>
        <button class="me-chip" onclick="A.logout()">${esc(meName)}</button>
      </div>
    </header>
    <nav class="tabs no-print">
      ${[["mes", "Mi mes"], ["equipo", "Equipo"], ["cobertura", "Cobertura"], ["ajustes", "Ajustes"]]
        .map(([k, l]) => `<button class="tab ${S.tab === k ? "on" : ""}" onclick="A.tab('${k}')">${l}</button>`).join("")}
    </nav>
    <main class="content no-print">${banners}${body}</main>
    ${sheetView()}
    ${printView()}
  `;
}

initData();
render();
</script>
</body>
</html>
