<style>

  .login-card { background: #fff; border-radius: 22px; padding: 26px 22px; max-width: 400px; margin: 8vh auto 0; box-shadow: 0 18px 44px rgba(0,0,0,.3); }

  .user-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .toggle { display: flex; gap: 5px; background: #F4F2EE; border-radius: 99px; padding: 4px; width: fit-content; margin: 0 auto 14px; }
  .tg { border: none; background: transparent; border-radius: 99px; padding: 7px 16px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 13px; color: var(--dim); cursor: pointer; }
  .tg.on { background: var(--ink); color: #fff; }
  .week-sub { text-align: center; font-size: 12px; color: var(--dim); margin: -8px 0 12px; }
  .wk-table { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 660px; }
  .wk-table th { font-family: Fredoka, sans-serif; font-size: 11px; color: var(--dim); font-weight: 600; padding: 2px 4px; text-align: center; }
  .wk-table th.hoy { color: var(--red); }
  .th-topic { display: block; margin: 2px auto 0; font-family: 'IBM Plex Mono', monospace; font-size: 7px; font-weight: 600; background: var(--oferta); border: 1px dashed var(--ink); border-radius: 4px; padding: 0 3px; width: fit-content; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .rowlab { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; border-radius: 6px; padding: 4px 6px; display: inline-block; }

  .chip { width: 24px; height: 24px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 10px; }

  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════
   CONFIGURACIÓN — proyecto lp-schedule + correo del administrador.
   ═══════════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDyK2xiLByLTxqR8Mfl_v9kwmtZEu-gFV8",
  authDomain: "lp-schedule.firebaseapp.com",
  databaseURL: "https://lp-schedule-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lp-schedule",

  messagingSenderId: "698909961621",
  appId: "1:698909961621:web:473d27e4d06fe726fada9c"
};
const ADMIN_EMAIL = "nico@lp.app"; // rol regional: puede editar ajustes y crear usuarios
/* ═══════════════════════════════════════════════════════════════════ */

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS = ["D","L","M","X","J","V","S"];
const DIAS_LARGO = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const SHIFT_H = 8;
const PERSON_COLORS = ["#23508F","#00A88E","#F2A33C","#8E5AD1","#E86FC1","#2E7D6B","#6B675F","#C9A227"];
const TIPOS = {
  M: { label: "Mañana", short: "MAÑANA 9–17", color: "#FFC845", ink: "#1D1D1B", base: 9,  starts: [8, 9, 10] },
  I: { label: "Mid",    short: "MID 11–19",   color: "#00A88E", ink: "#FFFFFF", base: 11, starts: [10, 11, 12] },
  O: { label: "Tarde/Otro", short: "TARDE/OTRO", color: "#23508F", ink: "#FFFFFF", base: 14, starts: null },
  L: { label: "Libre",  color: "#DFDCD6", ink: "#6B675F" },
  V: { label: "Vacaciones", color: "#9BD89B", ink: "#1D4D1D" },
};
const FEST_COLOR = "#C40D11";
const DEF_HOURS = { wk: { o: 10, c: 22 }, sa: { o: 10, c: 22 }, su: { o: 10, c: 22 } };
const DEFAULT_CONFIG = {
  regional: "Regional LP",
  people: [
    { id: "p1", name: "Aitor",     stores: [{ name: "Alfafar 1004", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] },
    { id: "p2", name: "Advisor 2", stores: [{ name: "Tienda 2", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] },
    { id: "p3", name: "Advisor 3", stores: [{ name: "Tienda 3", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] },
    { id: "p4", name: "Advisor 4", stores: [{ name: "Tienda 4", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] },
  ],
};

/* ── estado ── */
const now = new Date();
const S = {
  user: null, authReady: false, authErr: null, authBusy: false,
  whitelist: {},
  config: null, shifts: {}, topics: {}, ptopics: {},
  me: null, tab: "mes", viewPerson: null,
  ym: { y: now.getFullYear(), m: now.getMonth() },
  sheet: null, topicSheet: false, cfgDraft: null,
  wkAnchor: null, eqMode: "personas",
  saveState: "ok", demo: false, errText: null, loaded: false,
};

/* ── normalización (compatibilidad con datos anteriores) ── */
function normHours(h) {
  const one = (x, def) => ({ o: Number(x?.o ?? def.o), c: Number(x?.c ?? def.c) });
  h = h || {};
  return { wk: one(h.wk, DEF_HOURS.wk), sa: one(h.sa, DEF_HOURS.sa), su: one(h.su, DEF_HOURS.su) };
}
function normConfig(c) {
  c = c || JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  const people = (Array.isArray(c.people) ? c.people : Object.values(c.people || {})).map((p, i) => {
    let stores = p.stores;
    if (!stores) {
      const h = p.open != null ? { wk: { o: p.open, c: p.close }, sa: { o: p.open, c: p.close }, su: { o: p.open, c: p.close } } : null;
      stores = [{ name: p.store || "Tienda", pct: 0, hours: h }];
    }
    stores = (Array.isArray(stores) ? stores : Object.values(stores)).map((st) => ({
      name: st.name || "Tienda", pct: Number(st.pct || 0), hours: normHours(st.hours),
    }));
    return { id: p.id || "u" + i, name: p.name || "Advisor " + (i + 1), stores };
  });
  return { regional: c.regional || "Regional LP", people };
}
function normEntry(e, p, dateStr) {
  if (!e) return null;
  const out = { ...e };
  if (out.t === "C") out.t = "O";
  if (out.t === "T") {
    out.t = "O";
    if (out.s == null) out.s = hoursForDate(p, out.store || 0, parseDate(dateStr)).c - SHIFT_H;
  }
  if ((out.t === "M" || out.t === "I") && out.s == null) out.s = TIPOS[out.t].base;
  return out;
}

/* ── Firebase: auth + datos, o modo demo ── */
let db = null, auth = null, secApp = null, listenersOn = false, privRefPath = null;
const isDemo = () => JSON.stringify(FIREBASE_CONFIG).includes("PEGA_AQUI");
const ekey = (email) => email.toLowerCase().trim().replace(/\./g, ",");
const isAdmin = () => S.demo || (S.user && S.user.email === ADMIN_EMAIL);

function initApp() {
  if (isDemo()) {
    S.demo = true; S.authReady = true; S.user = { email: "demo@demo" };
    S.config = normConfig(null); S.loaded = true; computeMe(); render(); return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database(); auth = firebase.auth();
  } catch (e) {
    S.errText = "No se pudo iniciar Firebase: " + (e.message || e);
    S.authReady = true; render(); return;
  }
  auth.onAuthStateChanged((u) => {
    S.authReady = true; S.authBusy = false;
    S.user = u ? { email: (u.email || "").toLowerCase() } : null;
    if (u && !listenersOn) attachListeners();
    if (!u) detachListeners();
    render();
  });
}
function attachListeners() {
  listenersOn = true; S.loaded = false;
  if (isAdmin()) db.ref("whitelist/" + ekey(ADMIN_EMAIL)).set("regional").catch(() => {});
  db.ref("config").on("value", (snap) => {
    S.config = normConfig(snap.val());
    S.loaded = true; computeMe(); render();
  }, (err) => {
    S.errText = "Sin acceso a los datos. Si acabas de entrar, puede que tu correo no esté en la lista de acceso. (" + (err.message || err) + ")";
    S.loaded = true; S.config = null; render();
  });
  db.ref("shifts").on("value", (snap) => { S.shifts = snap.val() || {}; render(); }, () => {});
  db.ref("topics").on("value", (snap) => { S.topics = snap.val() || {}; render(); }, () => {});
  privRefPath = isAdmin() ? "ptopics" : "ptopics/" + ekey(S.user.email);
  db.ref(privRefPath).on("value", (snap) => {
    S.ptopics = flattenPriv(snap.val(), isAdmin() ? null : ekey(S.user.email));
    render();
  }, () => {});
  db.ref("whitelist").on("value", (snap) => { S.whitelist = snap.val() || {}; computeMe(); render(); }, () => {});
}
function detachListeners() {
  if (!listenersOn) return;
  listenersOn = false;
  ["config", "shifts", "topics", "whitelist"].forEach((p) => db.ref(p).off());
  if (privRefPath) { db.ref(privRefPath).off(); privRefPath = null; }
  S.config = null; S.shifts = {}; S.topics = {}; S.ptopics = {}; S.whitelist = {};
  S.me = null; S.loaded = false; S.errText = null; S.cfgDraft = null;
}
function secondaryAuth() {
  if (!secApp) secApp = firebase.initializeApp(FIREBASE_CONFIG, "creator");
  return secApp.auth();
}
function setSave(state) { S.saveState = state; const el = document.getElementById("savedot"); if (el) el.className = "save-dot " + state; }
function fbError(e, ctx) { setSave("error"); S.errText = ctx + ": " + (e.message || e); render(); }

function writeShift(pid, date, entry) {
  if (!S.shifts[pid]) S.shifts[pid] = {};
  if (entry) S.shifts[pid][date] = entry; else delete S.shifts[pid][date];
  render();
  if (S.demo || !db) return;
  setSave("saving");
  const ref = db.ref("shifts/" + pid + "/" + date);
  (entry ? ref.set(entry) : ref.remove()).then(() => setSave("ok")).catch((e) => fbError(e, "Error al guardar el turno"));
}
function writeConfig(cfg) {
  S.config = cfg; render();
  if (S.demo || !db) { toast("Guardado (modo demo)"); return; }
  setSave("saving");
  db.ref("config").set(cfg).then(() => { setSave("ok"); toast("Ajustes guardados"); }).catch((e) => fbError(e, "Error al guardar ajustes"));
}
function writeTopic(t) {
  if (S.demo || !db) { S.topics["local" + Date.now()] = t; render(); return; }
  setSave("saving");
  db.ref("topics").push(t).then(() => setSave("ok")).catch((e) => fbError(e, "Error al guardar el topic"));
}
function deleteTopic(id) {
  if (S.demo || !db) { delete S.topics[id]; delete S.ptopics[id]; render(); return; }
  const path = id.includes("|") ? "ptopics/" + id.replace("|", "/") : "topics/" + id;
  db.ref(path).remove().catch((e) => fbError(e, "Error al borrar el topic"));
}

/* ── utilidades ── */
const pad = (n) => String(n).padStart(2, "0");
const hLabel = (h) => { const hh = ((h % 24) + 24) % 24; return pad(Math.floor(hh)) + ":" + (h % 1 ? "30" : "00"); };
const hShort = (h) => pad(((Math.floor(h) % 24) + 24) % 24);
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const mkDate = (d) => S.ym.y + "-" + pad(S.ym.m + 1) + "-" + pad(d);
const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function people() { return (S.config?.people || []).map((p, i) => ({ ...p, color: PERSON_COLORS[i % PERSON_COLORS.length] })); }
function personById(pid) { return people().find((x) => x.id === pid) || people()[0]; }
const canEdit = (pid) => S.me === "regional" || S.me === pid;

/* el perfil no se elige: viene fijado por el correo con el que entras */
function computeMe() {
  if (!S.config) return;
  if (S.demo) { S.me = "regional"; }
  else if (!S.user) { S.me = null; return; }
  else if (S.user.email === ADMIN_EMAIL) { S.me = "regional"; }
  else {
    const v = (S.whitelist || {})[ekey(S.user.email)];
    S.me = typeof v === "string" ? v : v === true ? "viewer" : null;
  }
  if (S.me && S.me !== "regional" && S.me !== "viewer" && !people().some((p) => p.id === S.me)) S.me = "viewer";
  if (S.me && !S.viewPerson) S.viewPerson = (S.me !== "regional" && S.me !== "viewer") ? S.me : (people()[0]?.id || null);
}

function hoursForDate(p, storeIdx, date) {
  const st = p.stores[storeIdx] || p.stores[0];
  const wd = date.getDay();
  return wd === 0 ? st.hours.su : wd === 6 ? st.hours.sa : st.hours.wk;
}
function sundayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - x.getDay()); return x; }
function fiscalWeek(d) {
  let fs = sundayOf(new Date(d.getFullYear(), 1, 1));
  if (d < fs) fs = sundayOf(new Date(d.getFullYear() - 1, 1, 1));
  return Math.round((sundayOf(d) - fs) / (7 * 86400000)) + 1;
}
function shiftRange(entry) {
  if (!entry || !["M", "I", "O"].includes(entry.t)) return null;
  const s = entry.s ?? TIPOS[entry.t].base;
  return [s, s + SHIFT_H];
}
function flattenPriv(val, singleOwner) {
  const out = {};
  if (!val) return out;
  if (singleOwner) {
    for (const [id, t] of Object.entries(val)) out[singleOwner + "|" + id] = { ...t, priv: 1, owner: singleOwner };
  } else {
    for (const [ow, m] of Object.entries(val)) for (const [id, t] of Object.entries(m || {})) out[ow + "|" + id] = { ...t, priv: 1, owner: ow };
  }
  return out;
}
function allTopics() {
  return [...Object.entries(S.topics || {}), ...Object.entries(S.ptopics || {})];
}
function topicsForDate(dateStr) {
  return allTopics()
    .filter(([, t]) => t.from <= dateStr && dateStr <= t.to)
    .map(([id, t]) => ({ id, ...t, text: (t.priv ? "🔒 " : "") + t.text }));
}
function avatar(name, color, size, active) {
  const initials = (name || "?").split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  const st = active ? `background:${color};color:#fff;border:2px solid ${color}` : `background:#fff;color:${color};border:2px solid ${color}`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px;${st}">${esc(initials)}</div>`;
}
function priceBlock(entry, p, dateStr) {
  if (!entry) return `<div class="cal-hours">—</div>`;
  if (entry.t === "L") return `<div class="price" style="background:${TIPOS.L.color};color:${TIPOS.L.ink}">LIBRE</div>`;
  if (entry.t === "V") return `<div class="price" style="background:${TIPOS.V.color};color:${TIPOS.V.ink}">VACAS</div>`;
  if (entry.t) {
    const r = shiftRange(entry);
    const star = entry.store ? "★" : "";
    return `<div class="price" style="background:${TIPOS[entry.t].color};color:${TIPOS[entry.t].ink}">${hShort(r[0])}–${hShort(r[1])}h${star}</div>`;
  }
  if (entry.fest) return `<div class="price off">FEST OFF</div>`;
  return `<div class="cal-hours">📝</div>`;
}
function dayBar(entry, p, dateStr, height) {
  const date = parseDate(dateStr);
  const hrs = hoursForDate(p, entry?.store || 0, date);
  const lo = hrs.o - 2, hi = hrs.c, span = hi - lo;
  let inner = "";
  if (entry && (entry.t === "L" || entry.t === "V")) {
    inner = `<i style="left:0;width:100%;background:${TIPOS[entry.t].color}"></i>`;
  } else if (entry && !entry.t && entry.fest) {
    inner = `<i style="left:0;width:100%;background:${FEST_COLOR};opacity:.3"></i>`;
  } else {
    const r = shiftRange(entry);
    if (r) {
      const a = Math.max(r[0], lo), b = Math.min(r[1], hi);
      if (b > a) inner = `<i style="left:${((a - lo) / span) * 100}%;width:${((b - a) / span) * 100}%;background:${TIPOS[entry.t].color}"></i>`;
    }
  }
  return `<div class="daybar" style="height:${height}px">${inner}</div>`;
}
function legendHtml() {
  const item = (bg, ink, txt) => `<b style="background:${bg};color:${ink}">${txt}</b>`;
  return `<div class="legend">
    ${item(TIPOS.M.color, TIPOS.M.ink, "MAÑANA 9–17")}${item(TIPOS.I.color, TIPOS.I.ink, "MID 11–19")}
    ${item(TIPOS.O.color, TIPOS.O.ink, "TARDE/OTRO")}${item(TIPOS.L.color, TIPOS.L.ink, "LIBRE")}
    ${item(TIPOS.V.color, TIPOS.V.ink, "VACAS")}${item(FEST_COLOR, "#fff", "FESTIVO")}
  </div>`;
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}

/* ── acciones ── */
window.A = {
  /* sesión */
  login() {
    const em = document.getElementById("lg-email").value.toLowerCase().trim();
    const pw = document.getElementById("lg-pw").value;
    if (!em || !pw) { S.authErr = "Escribe el correo y la contraseña."; render(); return; }
    S.authErr = null; S.authBusy = true; render();
    auth.signInWithEmailAndPassword(em, pw).catch((e) => {
      S.authBusy = false;
      S.authErr = e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" || e.code === "auth/user-not-found"
        ? "Correo o contraseña incorrectos." : "No se pudo entrar: " + (e.message || e);
      render();
    });
  },
  signout() { if (S.demo) return; auth.signOut(); },
  tab(t) { S.tab = t; if (t === "ajustes") S.cfgDraft = JSON.parse(JSON.stringify(S.config)); render(); },
  view(pid) { S.viewPerson = pid; render(); },
  navW(dir) {
    if (!S.wkAnchor) S.wkAnchor = sundayOf(now);
    const d = new Date(S.wkAnchor); d.setDate(d.getDate() + dir * 7);
    S.wkAnchor = d; render();
  },
  eqMode(m) { S.eqMode = m; render(); },
  nav(dir) { let { y, m } = S.ym; m += dir; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.ym = { y, m }; render(); },

  /* editor de día */
  openDay(pid, d) { A.openDate(pid, mkDate(d)); },
  openDate(pid, date) {
    if (!canEdit(pid)) return;
    const cur = (S.shifts[pid] || {})[date];
    S.sheet = { pid, date, draft: cur ? { ...normEntry(cur, personById(pid), date) } : {} };
    render();
  },
  closeSheet() { S.sheet = null; S.topicSheet = false; render(); },
  _grabNote() { const ta = document.getElementById("sheet-note"); if (ta && S.sheet) S.sheet.draft.note = ta.value; },
  sd(t) {
    A._grabNote();
    const dr = S.sheet.draft;
    if (dr.t === t) { delete dr.t; delete dr.s; }
    else {
      dr.t = t;
      if (t === "M" || t === "I") dr.s = TIPOS[t].base;
      else if (t === "O") {
        const p = personById(S.sheet.pid);
        dr.s = hoursForDate(p, dr.store || 0, parseDate(S.sheet.date)).c - SHIFT_H;
      } else { delete dr.s; }
    }
    render();
  },
  sdStart(s) { A._grabNote(); S.sheet.draft.s = s; render(); },
  sdStore(i) { A._grabNote(); S.sheet.draft.store = i; render(); },
  sdFest() { A._grabNote(); S.sheet.draft.fest = S.sheet.draft.fest ? 0 : 1; render(); },
  saveSheet() {
    A._grabNote();
    const { pid, date, draft } = S.sheet;
    const entry = {};
    if (draft.t) { entry.t = draft.t; if (draft.s != null && draft.t !== "L" && draft.t !== "V") entry.s = draft.s; }
    if (draft.store) entry.store = draft.store;
    if (draft.fest) entry.fest = 1;
    if (draft.note && draft.note.trim()) entry.note = draft.note.trim();
    writeShift(pid, date, Object.keys(entry).length ? entry : null);
    S.sheet = null; render();
  },
  clearDay() { const { pid, date } = S.sheet; writeShift(pid, date, null); S.sheet = null; render(); },

  /* topics */
  openTopic() { S.topicSheet = true; render(); },
  saveTopic() {
    const from = document.getElementById("tp-from").value;
    const to = document.getElementById("tp-to").value || from;
    const text = document.getElementById("tp-text").value.trim();
    const priv = document.getElementById("tp-vis").value === "priv";
    if (!from || !text) { toast("Falta la fecha o el texto"); return; }
    const meName = S.me === "regional" ? S.config.regional : (people().find((p) => p.id === S.me)?.name || "");
    const t = { from, to: to < from ? from : to, text, by: meName };
    if (priv) {
      if (S.demo || !db) { S.ptopics["demo|" + Date.now()] = { ...t, priv: 1, owner: "demo" }; }
      else {
        setSave("saving");
        db.ref("ptopics/" + ekey(S.user.email)).push(t).then(() => setSave("ok")).catch((e) => fbError(e, "Error al guardar el topic"));
      }
    } else {
      writeTopic(t);
    }
    S.topicSheet = false; render();
  },
  delTopic(id) { if (confirm("¿Borrar este topic para todo el equipo?")) deleteTopic(id); },

  /* usuarios (solo admin) */
  createUser() {
    const em = document.getElementById("cu-email").value.toLowerCase().trim();
    const pw = document.getElementById("cu-pw").value;
    const role = document.getElementById("cu-role").value || "viewer";
    if (!/^\S+@\S+\.\S+$/.test(em)) { toast("El correo debe tener formato usuario@dominio.algo"); return; }
    if (pw.length < 6) { toast("La contraseña necesita al menos 6 caracteres"); return; }
    if (S.demo) { toast("En modo demo no se crean usuarios"); return; }
    secondaryAuth().createUserWithEmailAndPassword(em, pw)
      .then(() => { secondaryAuth().signOut(); return db.ref("whitelist/" + ekey(em)).set(role); })
      .then(() => { toast("Usuario creado y vinculado"); document.getElementById("cu-email").value = ""; document.getElementById("cu-pw").value = ""; })
      .catch((e) => {
        toast(e.code === "auth/email-already-in-use" ? "Ese correo ya tiene cuenta" : "No se pudo crear: " + (e.message || e));
      });
  },
  setUserRole(k, v) {
    db.ref("whitelist/" + k).set(v).then(() => toast("Perfil actualizado")).catch((e) => toast("Error: " + (e.message || e)));
  },
  removeUser(k) {
    const email = k.replace(/,/g, ".");
    if (email === ADMIN_EMAIL) { toast("No puedes quitarte a ti mismo el acceso"); return; }
    if (!confirm("¿Quitar el acceso a " + email + "? Dejará de poder ver y editar nada.")) return;
    db.ref("whitelist/" + k).remove().then(() => toast("Acceso retirado")).catch((e) => toast("Error: " + (e.message || e)));
  },
  changePw() {
    const pw = document.getElementById("mypw").value;
    if (pw.length < 6) { toast("Mínimo 6 caracteres"); return; }
    if (S.demo) { toast("No disponible en modo demo"); return; }
    auth.currentUser.updatePassword(pw)
      .then(() => { toast("Contraseña cambiada"); document.getElementById("mypw").value = ""; })
      .catch((e) => toast(e.code === "auth/requires-recent-login" ? "Por seguridad, cierra sesión, vuelve a entrar y repítelo" : "Error: " + (e.message || e)));
  },

  /* ajustes */
  syncCfg() {
    const d = S.cfgDraft;
    const g = (id) => document.getElementById(id);
    if (g("cd-reg")) d.regional = g("cd-reg").value.trim() || "Regional LP";
    d.people.forEach((p, i) => {
      if (g(`cd-p${i}-name`)) p.name = g(`cd-p${i}-name`).value.trim() || "Advisor " + (i + 1);
      p.stores.forEach((st, j) => {
        const q = (suf) => g(`cd-p${i}-s${j}-${suf}`);
        if (!q("name")) return;
        st.name = q("name").value.trim() || "Tienda";
        st.pct = Math.max(0, Math.min(100, Number(q("pct")?.value || 0)));
        st.hours = {
          wk: { o: Number(q("wko").value), c: Number(q("wkc").value) },
          sa: { o: Number(q("sao").value), c: Number(q("sac").value) },
          su: { o: Number(q("suo").value), c: Number(q("suc").value) },
        };
      });
    });
  },
  addPerson() { A.syncCfg(); S.cfgDraft.people.push({ id: "u" + Date.now(), name: "", stores: [{ name: "", pct: 0, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }] }); render(); },
  delPerson(i) {
    if (!confirm("¿Eliminar este advisor? Sus turnos guardados dejarán de mostrarse.")) return;
    A.syncCfg(); S.cfgDraft.people.splice(i, 1); render();
  },
  addStore(i) { A.syncCfg(); S.cfgDraft.people[i].stores.push({ name: "", pct: 20, hours: JSON.parse(JSON.stringify(DEF_HOURS)) }); render(); },
  delStore(i, j) { A.syncCfg(); S.cfgDraft.people[i].stores.splice(j, 1); render(); },
  saveSettings() { A.syncCfg(); writeConfig(normConfig(S.cfgDraft)); },

  copy() {
    const ps = people(); const dim = daysInMonth(S.ym.y, S.ym.m);
    let out = "LOSS PREVENTION CALENDAR — " + MESES[S.ym.m].toUpperCase() + " " + S.ym.y + "\n";
    for (const p of ps) {
      out += "\n" + p.name + " · " + p.stores[0].name + "\n";
      const entries = S.shifts[p.id] || {};
      for (let d = 1; d <= dim; d++) {
        const e = normEntry(entries[mkDate(d)], p, mkDate(d));
        if (!e) continue;
        const r = shiftRange(e);
        const wd = DIAS[new Date(S.ym.y, S.ym.m, d).getDay()];
        const stName = e.store ? " @ " + (p.stores[e.store]?.name || "") : "";
        out += "  " + pad(d) + " " + wd + " — " + (e.t ? TIPOS[e.t].label : "") + (r ? " " + hLabel(r[0]) + "–" + hLabel(r[1]) : "")
             + stName + (e.fest ? " [FESTIVO]" : "") + (e.note ? " · " + e.note : "") + "\n";
      }
    }
    const done = () => toast("Resumen copiado");
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(out).then(done, () => fallbackCopy(out));
    else fallbackCopy(out);
  },
  print() { window.print(); },
};
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Resumen copiado"); } catch (e) { toast("No se pudo copiar"); }
  ta.remove();
}

function calGrid(renderCell) {
  const dim = daysInMonth(S.ym.y, S.ym.m);
  const fw = new Date(S.ym.y, S.ym.m, 1).getDay();
  let html = `<div class="cal-dow" style="font-size:9px">SEM</div>` + DIAS.map((d) => `<div class="cal-dow">${d}</div>`).join("");
  const slots = [];
  for (let i = 0; i < fw; i++) slots.push(null);
  for (let d = 1; d <= dim; d++) slots.push(d);
  while (slots.length % 7) slots.push(null);
  for (let r = 0; r < slots.length / 7; r++) {
    const rowDate = new Date(S.ym.y, S.ym.m, 1 - fw + r * 7);
    html += `<div class="wk-cell" title="Semana fiscal">S${fiscalWeek(rowDate)}</div>`;
    for (let c = 0; c < 7; c++) {
      const d = slots[r * 7 + c];
      html += d === null ? "<div></div>" : renderCell(d);
    }
  }
  return `<div class="cal-grid">${html}</div>`;
}

function coberturaView() {
  const p = personById(S.viewPerson);
  const entries = S.shifts[p.id] || {};
  const dim = daysInMonth(S.ym.y, S.ym.m);
  const weeks = new Map();
  const monthTotals = { M: 0, I: 0, O: 0 };
  let workedDays = 0; const storeDays = {};
  for (let d = 1; d <= dim; d++) {
    const date = new Date(S.ym.y, S.ym.m, d);
    const wk = fiscalWeek(date);
    if (!weeks.has(wk)) weeks.set(wk, { M: 0, I: 0, O: 0, from: d, to: d });
    weeks.get(wk).to = d;
    const e = normEntry(entries[mkDate(d)], p, mkDate(d));
    if (e && ["M", "I", "O"].includes(e.t)) {
      weeks.get(wk)[e.t]++; monthTotals[e.t]++; workedDays++;
      storeDays[e.store || 0] = (storeDays[e.store || 0] || 0) + 1;
    }
  }
  const rows = [...weeks.entries()].map(([wk, w]) => `
    <tr>
      <td>S${wk} <span class="muted">(${w.from}–${w.to})</span></td>
      ${["M", "I", "O"].map((t) => `<td><span class="chk" style="background:${w[t] ? TIPOS[t].color : "#EFEDE8"};color:${w[t] ? TIPOS[t].ink : "#B4B0A8"}">${w[t] || "·"}</span></td>`).join("")}
    </tr>`).join("");
  const verdict = ["M", "I", "O"].map((t) => monthTotals[t]
    ? `<span class="v-pill v-ok">✓ ${TIPOS[t].label}: ${monthTotals[t]} este mes</span>`
    : `<span class="v-pill v-bad">✗ Falta hacer ${TIPOS[t].label} este mes</span>`).join("");
  let storesHtml = "";
  if (p.stores.length > 1) {
    storesHtml = `<div class="gaps-title" style="margin-top:16px">Visitas a tiendas (${workedDays} días trabajados)</div>` +
      p.stores.map((st, j) => {
        const days = storeDays[j] || 0;
        const pct = workedDays ? Math.round((days / workedDays) * 100) : 0;
        if (j === 0) return `<div class="pct-row">${esc(st.name)} <span class="muted">· principal · ${days} días (${pct}%)</span></div>`;
        const ok = pct >= st.pct;
        return `<div class="pct-row">${esc(st.name)} · ${days} días (${pct}%) — objetivo ${st.pct}% ${ok ? "✓" : "✗"}
          <div class="pct-bar"><i style="width:${Math.min(pct, 100)}%;background:${ok ? "#00A88E" : "#C40D11"}"></i><span class="pct-target" style="left:${Math.min(st.pct, 100)}%"></span></div>
        </div>`;
      }).join("");
  }
  const teamHtml = `<div class="team-summary"><div class="gaps-title">Resumen del equipo · ${MESES[S.ym.m]}</div>` +
    people().map((q) => {
      const ent = S.shifts[q.id] || {};
      const tot = { M: 0, I: 0, O: 0 }; let wd = 0; const sd = {};
      for (let d = 1; d <= dim; d++) {
        const e = normEntry(ent[mkDate(d)], q, mkDate(d));
        if (e && ["M", "I", "O"].includes(e.t)) { tot[e.t]++; wd++; sd[e.store || 0] = (sd[e.store || 0] || 0) + 1; }
      }
      const missing = ["M", "I", "O"].filter((t) => !tot[t]).map((t) => TIPOS[t].label);
      const storeFail = q.stores.slice(1).filter((st, j) => wd && Math.round(((sd[j + 1] || 0) / wd) * 100) < st.pct).map((st) => st.name);
      const probs = [...missing.map((m) => "falta " + m), ...storeFail.map((s) => "visitas a " + s)];
      return `<div class="topic-line"><span class="dot" style="background:${q.color}"></span>${esc(q.name)}: ${probs.length ? '<span style="color:#C40D11">' + esc(probs.join(", ")) + "</span>" : '<span style="color:#00584A">todo cubierto ✓</span>'}</div>`;
    }).join("") + `</div>`;
  return personRow(p.id) + monthNav()
    + `<div class="cov-scroll"><table class="cov-week-table">
        <thead><tr><th>Semana</th>${["M", "I", "O"].map((t) => `<th>${TIPOS[t].label}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="verdict">${verdict}</div>` + storesHtml + teamHtml;
}

  if (dr.t === "M" || dr.t === "I") {
    starts = TIPOS[dr.t].starts.map((h) =>
      `<button class="start-btn ${dr.s === h ? "sel" : ""}" onclick="A.sdStart(${h})">${hLabel(h)}–${hLabel(h + 8)}</button>`).join("");
  } else if (dr.t === "O") {
    const opts = [];
    for (let h = hrs.o - 2; h <= hrs.c - SHIFT_H + 2; h++) opts.push(h);
    starts = opts.map((h) =>
      `<button class="start-btn ${dr.s === h ? "sel" : ""}" onclick="A.sdStart(${h})">${hLabel(h)}–${hLabel(h + 8)}</button>`).join("");
  }
  return `<div class="sheet-backdrop" onclick="A.closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-title">${wd} ${d} · ${esc(p.name)}</div>
      <div class="type-grid">${typeBtn("M")}${typeBtn("I")}${typeBtn("O")}</div>
      <div class="type-grid2">${typeBtn("L")}${typeBtn("V")}</div>
      ${starts ? `<div class="sheet-sub">Hora del turno (8 h) — vuelve a tocar el tipo para quitarlo</div><div class="sheet-starts">${starts}</div>` : ""}
      ${p.stores.length > 1 ? `<div class="sheet-sub">¿En qué tienda?</div><div class="sheet-starts">
        ${p.stores.map((st, j) => `<button class="chip-btn ${(dr.store || 0) === j ? "sel" : ""}" onclick="A.sdStore(${j})">${esc(st.name)}</button>`).join("")}</div>` : ""}
      <div class="sheet-sub">Extras</div>
      <div class="sheet-starts">
        <button class="chip-btn ${dr.fest ? "fest-on" : ""}" onclick="A.sdFest()">${dr.fest ? "✓ " : ""}Festivo${dr.fest && !dr.t ? " (no trabajado)" : ""}</button>
      </div>
      <div class="sheet-sub">Nota / comentario del día (visible para todos)</div>
      <textarea class="note-area" id="sheet-note" placeholder="Ej.: cambio a Mid por auditoría; revisar mermas sección 4…">${esc(dr.note || "")}</textarea>
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
        <button class="btn-primary" style="margin-top:0" onclick="A.saveSheet()">Guardar día</button>
        <button class="btn-ghost" onclick="A.clearDay()">Vaciar día</button>
        <button class="btn-ghost" onclick="A.closeSheet()">Cerrar</button>
      </div>
    </div>
  </div>`;
}
function printView() {
  const ps = people(); const dim = daysInMonth(S.ym.y, S.ym.m);
  return `<div class="print-only"><h1>Loss Prevention Calendar — ${MESES[S.ym.m]} ${S.ym.y}</h1>` +
    ps.map((p) => {
      const entries = S.shifts[p.id] || {};
      let rows = "";
      for (let d = 1; d <= dim; d++) {
        const e = normEntry(entries[mkDate(d)], p, mkDate(d));
        const r = shiftRange(e);
        const stName = e?.store ? " @ " + esc(p.stores[e.store]?.name || "") : "";
        rows += `<tr><td>S${fiscalWeek(new Date(S.ym.y, S.ym.m, d))} · ${pad(d)} ${DIAS[new Date(S.ym.y, S.ym.m, d).getDay()]}</td>
          <td>${e?.t ? TIPOS[e.t].label : e?.fest ? "Festivo" : "—"}${e?.fest && e?.t ? " (festivo)" : ""}</td>
          <td>${r ? hLabel(r[0]) + "–" + hLabel(r[1]) : ""}${stName}</td>
          <td>${esc(e?.note || "")}</td></tr>`;
      }
      return `<div class="print-block"><h2>${esc(p.name)} · ${esc(p.stores[0].name)}</h2><table><tbody>${rows}</tbody></table></div>`;
    }).join("") + `</div>`;
}

/* ── render principal ── */
function render() {
  const app = document.getElementById("app");
  if (!S.authReady) {
    app.innerHTML = `<div style="padding:70px;text-align:center;color:#fff;font-family:Fredoka,sans-serif">Cargando…</div>`;
    return;
  }
  if (!S.user && !S.demo) { app.innerHTML = authView(); return; }
  if (!S.loaded || !S.config) {
    const err = S.errText ? `<div class="login-card"><div class="err-banner" style="margin:0">${esc(S.errText)}</div>
      <div style="text-align:center;margin-top:12px"><button class="btn-ghost" onclick="A.signout()">Cerrar sesión</button></div></div>` : "";
    app.innerHTML = `<div class="wrap"><div style="padding:40px;text-align:center;color:#fff;font-family:Fredoka,sans-serif">${S.errText ? "" : "Cargando calendario…"}</div>${err}</div>`;
    return;
  }
  if (!S.me) { app.innerHTML = `<div class="wrap"><div style="padding:40px;text-align:center;color:#fff;font-family:Fredoka,sans-serif">Cargando perfil…</div></div>`; return; }
  const meName = S.me === "regional" ? S.config.regional : S.me === "viewer" ? "Solo lectura" : (people().find((p) => p.id === S.me)?.name || "—");
  const banners =
    (S.errText ? `<div class="err-banner no-print">${esc(S.errText)}</div>` : "") +
    (S.demo ? `<div class="ro-banner no-print">Modo demo: sin Firebase, los datos se pierden al recargar.</div>` : "");
  let body = "";
  if (S.tab === "mes") body = mesView();
  else if (S.tab === "equipo") body = equipoView();
  else if (S.tab === "cobertura") body = coberturaView();
  else body = ajustesView();
  app.innerHTML = `
    <div class="wrap">
      <header class="topbar no-print">
        <div class="wordmark">LP CALENDAR</div>
        <div class="topbar-right">
          <span id="savedot" class="save-dot ${S.saveState}"></span>
          <button class="top-btn" onclick="A.copy()">Copiar</button>
          <button class="top-btn" onclick="A.print()">Imprimir</button>
          <button class="me-chip" onclick="A.tab('ajustes')" title="Tu perfil viene fijado por tu correo">${esc(meName)}</button>
        </div>
      </header>
      <nav class="tabs no-print">
        ${[["mes", "Mi mes"], ["equipo", "Equipo"], ["cobertura", "Cobertura"], ["ajustes", "Ajustes"]]
          .map(([k, l]) => `<button class="tab ${S.tab === k ? "on" : ""}" onclick="A.tab('${k}')">${l}</button>`).join("")}
      </nav>
      <main class="content no-print">${banners}${body}</main>
    </div>
    ${sheetView()}
    ${printView()}
  `;
}

initApp();
render();
</script>
</body>
</html>
